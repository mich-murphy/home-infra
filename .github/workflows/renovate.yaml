name: Renovate
on:
  workflow_dispatch:
    inputs:
      overrideSchedule:
        description: "Override all schedules"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "30 4,6 * * *"
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Renovate
        uses: renovatebot/github-action@6d26fcf0275dc65624cbc3d51fe78bc773f98321 # v46.3.6
        env:
          RENOVATE_FORCE: ${{ inputs.overrideSchedule == true && '{''schedule'':null}' || '' }}
          # The second rule lets the cliproxy-controller custom datasource read
          # that private repository's releases; it ranks below the platform
          # token's own rule, so Renovate's repository work keeps RENOVATE_TOKEN.
          RENOVATE_HOST_RULES: >-
            [{"hostType":"docker","matchHost":"ghcr.io","username":"mich-murphy","password":"${{ secrets.RENOVATE_TOKEN }}"},
            {"matchHost":"https://api.github.com/repos/mich-murphy/cliproxy-controller/","token":"${{ secrets.CLIPROXY_CONTROLLER_RELEASES_TOKEN }}"}]
        with:
          configurationFile: .github/renovate-config.json
          token: ${{ secrets.RENOVATE_TOKEN }}
