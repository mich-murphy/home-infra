name: Docker

on:
  pull_request:
    branches:
      - main
    paths:
      - "docker/**"
      - "network/**"
      - "scripts/check-portainer-drift.sh"
      - "tests/docker-hardening.sh"
      - "tests/media-broker-*.sh"
      - "tests/fixtures/**"
      - "docs/docker-hardening.md"
      - "docs/docker-deployment.md"
      - "docs/hermes-media.md"
      - "docker/portainer-stacks.yaml"
      - ".github/workflows/_quality-gate.yaml"
      - ".github/workflows/docker.yaml"
      - "flake.lock"
      - "flake.nix"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    uses: ./.github/workflows/_quality-gate.yaml
    with:
      check: docker
