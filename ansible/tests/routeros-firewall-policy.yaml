---
- name: Test RouterOS firewall policy invariants
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../network/inventory.yaml
    - ../group_vars/routeros.yaml
  vars:
    comments: "{{ _routeros_forward_policy | map(attribute='comment') | list }}"
    rules: "{{ dict(comments | zip(_routeros_forward_policy)) }}"
  tasks:
    - name: Derive strict firewall policy
      ansible.builtin.import_tasks: ../roles/routeros/tasks/firewall-policy.yaml

    - name: Verify default deny and peer protocol coverage
      ansible.builtin.assert:
        that:
          - comments | unique | length == comments | length
          - "comments[-1] == 'DEFAULT DROP (managed: routeros role)'"
          - "rules[comments[-1]].action == 'drop'"
          - "rules['DMZ drop internal routing (managed: routeros role)']['dst-address-list'] == 'internal'"
          - "_routeros_qbittorrent_dstnat_policy | map(attribute='protocol') | sort == ['tcp', 'udp']"

    - name: Keep isolation rules ahead of their routed accepts
      ansible.builtin.assert:
        that:
          - rules[item[0]].action == 'drop'
          - comments.index(item[0]) < comments.index(item[1])
      loop:
        - ['OOB drop routed traffic (managed: routeros role)', 'WAN -> qBittorrent peers tcp (managed: routeros role)']
        - ['DMZ drop internal routing (managed: routeros role)', '10.77.99.0/24 -> WAN (managed: routeros role)']
        - ['GST drop internal routing (managed: routeros role)', '10.77.60.0/24 -> WAN (managed: routeros role)']
        - ['KDS drop DoT (managed: routeros role)', '10.77.50.0/24 -> WAN (managed: routeros role)']
        - ['KDS drop DoQ (managed: routeros role)', '10.77.50.0/24 -> WAN (managed: routeros role)']

    - name: Limit both client VLANs to Docker host HTTPS
      ansible.builtin.assert:
        that:
          - rules[item].action == 'accept'
          - rules[item]['dst-address'] == network.infrastructure.docker_host
          - rules[item].protocol == 'tcp'
          - rules[item]['dst-port'] == 443
      loop:
        - 'DFLT -> Docker host HTTPS (managed: routeros role)'
        - 'KDS -> Docker host media HTTPS (managed: routeros role)'

    - name: Verify qBittorrent peer forwarding fields
      ansible.builtin.assert:
        that:
          - item.chain == 'dstnat'
          - item.action == 'dst-nat'
          - item['in-interface-list'] == 'WAN'
          - item['dst-port'] | int == routeros_qbittorrent_peer_port
          - item['to-addresses'] == network.infrastructure.docker_host
          - item['to-ports'] | int == routeros_qbittorrent_peer_port
      loop: "{{ _routeros_qbittorrent_dstnat_policy }}"
      loop_control:
        label: "{{ item.protocol }}"

    - name: Save strict policy and select recovery posture
      ansible.builtin.set_fact:
        strict_forward_policy: "{{ _routeros_forward_policy }}"
        routeros_enable_default_drop: false

    - name: Derive recovery firewall policy
      ansible.builtin.include_tasks: ../roles/routeros/tasks/firewall-policy.yaml

    - name: Verify recovery removes only the final default drop
      ansible.builtin.assert:
        that:
          - _routeros_forward_policy == strict_forward_policy[:-1]
