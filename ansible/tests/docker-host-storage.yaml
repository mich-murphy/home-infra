---
- name: Accept idle automounts, active NFS and absent mounts
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    nfs_findmnt_command: "{{ lookup('ansible.builtin.env', 'FAKE_FINDMNT') }}"
    nfs_mounts:
      - { name: idle, local_path: /mnt/idle, nfs_share: 'nas:/idle' }
      - { name: active, local_path: /mnt/active, nfs_share: 'nas:/active' }
      - { name: absent, local_path: /mnt/absent, nfs_share: 'nas:/absent' }
  tasks:
    - name: Exercise production storage guards
      ansible.builtin.include_tasks: ../roles/docker-host/tasks/storage-state.yaml

# Inventory names select local fixtures, not remote machines.
- name: Reject wrong NFS sources and unknown automounters
  hosts: wrong:idle-wrong:foreign-autofs
  connection: local
  gather_facts: false
  vars:
    nfs_findmnt_command: "{{ lookup('ansible.builtin.env', 'FAKE_FINDMNT') }}"
    nfs_mounts:
      - name: "{{ inventory_hostname }}"
        local_path: "/mnt/{{ inventory_hostname }}"
        nfs_share: nas:/configured
  tasks:
    - name: Require the source guard to reject each unsafe fixture
      block:
        - name: Exercise production storage guards
          ansible.builtin.include_tasks: ../roles/docker-host/tasks/storage-state.yaml
        - name: Fail if unsafe storage was accepted
          ansible.builtin.fail:
            msg: Unsafe storage unexpectedly passed
      rescue:
        - name: Confirm rejection came from the source guard
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Refuse unsafe NFS source changes'
