---
# Proxmox derives a guest's NoCloud instance ID from a hash of its generated
# user-data and network configuration, so any change to the VM's cloud-init
# settings makes the next boot look like a new instance's first boot: SSH host
# keys are regenerated, the cloud-init user is set up again and the
# vendor-data, with its Tailscale auth key, runs again. Trusting the cached
# instance stops that. docs/proxmox-templates.md covers what the guest no
# longer picks up and how to re-provision one deliberately.
- name: check whether cloud-init is installed
  ansible.builtin.stat:
    path: /usr/bin/cloud-init
  register: cloud_init_binary

- name: keep cloud-init on its cached instance when the instance ID changes
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-manual-cache-clean.cfg
    content: |
      # Managed by Ansible (common role). Trust the cached instance rather than
      # treating a new instance ID as a first boot; `cloud-init clean` re-runs it.
      manual_cache_clean: true
    owner: root
    group: root
    mode: "0644"
  when: cloud_init_binary.stat.exists

# Every cached instance keeps the vendor-data's Tailscale auth key in its
# vendor-data, the cloud-config and scripts rendered from it and the pickled
# datasource, and so does the current boot's instance data. The script prints
# counts only and overwrites each key with filler of the same length, which
# keeps the cache loadable. Check mode only counts; a re-run changes nothing.
# Python reads the helper from stdin: the command module runs without a TTY,
# so sudo adds no terminal markers to the JSON it prints.
- name: count the Tailscale auth keys cached by cloud-init
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - "-"
      - "--count"
    stdin: "{{ lookup('ansible.builtin.file', 'redact-cloud-init-tailscale-keys') }}"
  register: cloud_init_cached_tailscale_keys
  changed_when: false
  check_mode: false
  when: cloud_init_binary.stat.exists

- name: redact the Tailscale auth keys cached by cloud-init
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - "-"
      - "--redact"
    stdin: "{{ lookup('ansible.builtin.file', 'redact-cloud-init-tailscale-keys') }}"
  register: cloud_init_tailscale_key_redaction
  changed_when: (cloud_init_tailscale_key_redaction.stdout | from_json).redacted_files > 0
  when:
    - cloud_init_binary.stat.exists
    - not ansible_check_mode

- name: verify that cloud-init caches no Tailscale auth key
  ansible.builtin.assert:
    that:
      - (cloud_init_tailscale_key_redaction.stdout | from_json).errors == 0
      - (cloud_init_tailscale_key_redaction.stdout | from_json).remaining_keys == 0
    fail_msg: >-
      cloud-init still caches a Tailscale auth key under /var/lib/cloud or
      /run/cloud-init ({{ cloud_init_tailscale_key_redaction.stdout | trim }}).
    quiet: true
  when:
    - cloud_init_binary.stat.exists
    - not ansible_check_mode
