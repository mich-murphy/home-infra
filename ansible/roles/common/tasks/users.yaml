---
# Debian LXC templates ship without sudo (needed by the sudoers task); Arch hosts skip it.
- name: ensure sudo is installed
  ansible.builtin.apt:
    name: sudo
    state: present
    update_cache: true
    lock_timeout: 300
  when: ansible_facts["os_family"] == "Debian"

- name: ensure wheel group exists
  ansible.builtin.group:
    name: wheel
    state: present

- name: create management user
  ansible.builtin.user:
    name: "{{ username }}"
    shell: "{{ user_shell | default('/bin/bash') }}"
    groups: wheel
    append: true

- name: ensure management user's home is owned by the user
  ansible.builtin.file:
    path: "/home/{{ username }}"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0750"

- name: ensure management user's SSH directory exists
  ansible.builtin.file:
    path: "/home/{{ username }}/.ssh"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0700"

- name: add authorised ssh key to user
  ansible.builtin.lineinfile:
    path: "/home/{{ username }}/.ssh/authorized_keys"
    line: "{{ ssh_public_key }}"
    state: present
    create: true
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0600"

- name: allow wheel group sudo without password
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    state: present
    regexp: "^%wheel"
    line: "%wheel ALL=(ALL) NOPASSWD: ALL"
    validate: "visudo -cf %s"
