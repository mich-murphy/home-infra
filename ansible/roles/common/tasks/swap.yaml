---
- name: validate swap_mode
  ansible.builtin.assert:
    that: swap_mode in ['file', 'zram', 'none']
    fail_msg: "swap_mode must be one of: file, zram, none (got: {{ swap_mode }})"

- name: configure zswap
  ansible.builtin.include_tasks: swap-zswap.yaml

- name: configure file swap
  ansible.builtin.include_tasks: swap-file.yaml
  when: swap_mode == 'file'

- name: configure zram swap
  ansible.builtin.include_tasks: swap-zram.yaml
  when: swap_mode == 'zram'

- name: disable all swap
  ansible.builtin.include_tasks: swap-none.yaml
  when: swap_mode == 'none'

# skipped when there's no swap (also unprivileged LXCs can't write kernel sysctls)
- name: remove legacy swappiness entry from sysctl.conf
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    regexp: '^\s*vm\.swappiness\s*='
    state: absent
  when: swap_mode != 'none'

- name: persist swappiness
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-swap.conf
    content: |
      vm.swappiness={{ swap_swappiness }}
    owner: root
    group: root
    mode: "0644"
  register: swappiness_config
  when: swap_mode != 'none'

- name: read active swappiness
  ansible.builtin.command:
    cmd: sysctl -n vm.swappiness
  register: active_swappiness
  changed_when: false
  check_mode: false
  when: swap_mode != 'none'

- name: apply swappiness
  ansible.builtin.command:
    cmd: "sysctl -w vm.swappiness={{ swap_swappiness }}"
  when:
    - swap_mode != 'none'
    - swappiness_config.changed or active_swappiness.stdout != (swap_swappiness | string)
  changed_when: true
