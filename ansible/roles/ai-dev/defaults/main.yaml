---
# Legacy inet filter removal requires an explicit operator-approved migration.
ai_dev_allow_legacy_nft_migration: false

# earlyoom sends SIGTERM to the largest process when both available memory and
# free swap fall below these percentages (SIGKILL at half of each). Preferred
# victims are transient browser and Node runtimes from interactive work; access
# paths stay protected.
ai_dev_earlyoom_mem_percent: 8
ai_dev_earlyoom_swap_percent: 8
ai_dev_earlyoom_avoid: "(^|/)(init|systemd.*|sshd.*|mosh-server|tailscaled|herdr|moshi-hook|dbus-broker.*)$"
ai_dev_earlyoom_prefer: "(^|/)(chrome|headless_shell|node)$"

# The retired Hermes agent account. Removing it is destructive, so it runs only
# when an operator opts in for one run (-e ai_dev_hermes_decommission=true).
ai_dev_hermes_decommission: false
ai_dev_hermes_user: hermes
ai_dev_hermes_home: /home/hermes
