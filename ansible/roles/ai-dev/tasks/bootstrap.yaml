---
- name: Refresh pacman and upgrade system
  ansible.builtin.command:
    argv:
      - /usr/bin/pacman
      - --sync
      - --refresh
      - --sysupgrade
      - --noconfirm
  register: ai_dev_pacman_upgrade
  changed_when: >-
    'there is nothing to do' not in
    ((ai_dev_pacman_upgrade.stdout + ai_dev_pacman_upgrade.stderr) | lower)

# Access tooling only; services on this host ship as pinned, self-contained
# release binaries rather than distro packages.
- name: Install bootstrap packages
  community.general.pacman:
    state: present
    name:
      - git
      - openssh
      - mosh
      - curl
      - jq
      - python

- name: Ensure systemd-logind drop-in dir exists
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

# The management user's Herdr workspaces must survive SSH logout.
- name: Keep user services alive after SSH logout
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/ai-dev.conf
    content: |
      [Login]
      KillUserProcesses=no
    owner: root
    group: root
    mode: '0644'
  notify: restart systemd-logind

- name: Ensure en_AU.UTF-8 line uncommented in /etc/locale.gen
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: '^\s*#?\s*en_AU\.UTF-8\s+UTF-8\s*$'
    line: 'en_AU.UTF-8 UTF-8'
    state: present
  register: locale_gen_line

- name: Regenerate locales
  ansible.builtin.command:
    cmd: locale-gen
  when: locale_gen_line.changed

- name: Set system locale to en_AU.UTF-8
  ansible.builtin.copy:
    dest: /etc/locale.conf
    content: "LANG=en_AU.UTF-8\n"
    owner: root
    group: root
    mode: '0644'
