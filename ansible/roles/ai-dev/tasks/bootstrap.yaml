---
- name: Refresh pacman and upgrade system
  ansible.builtin.command:
    argv:
      - /usr/bin/pacman
      - --sync
      - --refresh
      - --sysupgrade
      - --noconfirm
  register: ai_dev_pacman_upgrade
  changed_when: >-
    'there is nothing to do' not in
    ((ai_dev_pacman_upgrade.stdout + ai_dev_pacman_upgrade.stderr) | lower)

# The Hermes installer provides its own runtimes (a uv virtualenv, a
# Hermes-managed Node, and a Playwright browser); the base system carries only
# access and installer prerequisites.
- name: Install bootstrap packages
  community.general.pacman:
    state: present
    name:
      - git
      - openssh
      - mosh
      - curl
      - jq
      - python

# The management user keeps no persistent services: its retired Moshi user unit
# is stopped and linger is dropped, so the hermes account holds the default
# 127.0.0.1:24543 gateway port uncontended.
- name: Read the management user's retired Moshi unit state
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - "--machine={{ username }}@"
      - --user
      - --no-legend
      - --no-pager
      - list-unit-files
      - moshi-hook.service
  register: ai_dev_management_moshi_unit
  changed_when: false
  failed_when: ai_dev_management_moshi_unit.rc not in [0, 1]
  when: not ansible_check_mode

- name: Stop and disable the management user's retired Moshi daemon
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - "--machine={{ username }}@"
      - --user
      - disable
      - --now
      - moshi-hook.service
  changed_when: true
  when:
    - not ansible_check_mode
    - "'moshi-hook.service' in (ai_dev_management_moshi_unit.stdout | default(''))"

- name: Disable linger for the management user
  ansible.builtin.command:
    cmd: "loginctl disable-linger {{ username }}"
    removes: "/var/lib/systemd/linger/{{ username }}"
  when: not ansible_check_mode

- name: Ensure systemd-logind drop-in dir exists
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

# The hermes account's Herdr workspaces and Moshi user service must survive SSH
# logout (that account's linger is enabled in hermes.yaml).
- name: Keep user services alive after SSH logout
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/ai-dev.conf
    content: |
      [Login]
      KillUserProcesses=no
    owner: root
    group: root
    mode: '0644'
  notify: restart systemd-logind

- name: Ensure en_AU.UTF-8 line uncommented in /etc/locale.gen
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: '^\s*#?\s*en_AU\.UTF-8\s+UTF-8\s*$'
    line: 'en_AU.UTF-8 UTF-8'
    state: present
  register: locale_gen_line

- name: Regenerate locales
  ansible.builtin.command:
    cmd: locale-gen
  when: locale_gen_line.changed

- name: Set system locale to en_AU.UTF-8
  ansible.builtin.copy:
    dest: /etc/locale.conf
    content: "LANG=en_AU.UTF-8\n"
    owner: root
    group: root
    mode: '0644'
