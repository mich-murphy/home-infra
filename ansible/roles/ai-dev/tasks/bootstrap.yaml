---
- name: Refresh pacman and upgrade system
  ansible.builtin.command:
    argv:
      - /usr/bin/pacman
      - --sync
      - --refresh
      - --sysupgrade
      - --noconfirm
  register: ai_dev_pacman_upgrade
  changed_when: >-
    'there is nothing to do' not in
    ((ai_dev_pacman_upgrade.stdout + ai_dev_pacman_upgrade.stderr) | lower)

- name: Remove the legacy tmux package
  community.general.pacman:
    name: tmux
    state: absent

- name: Install bootstrap packages and Neovim LSPs/formatters
  community.general.pacman:
    state: present
    name:
      - base-devel
      - git
      - fish
      - neovim
      - openssh
      - mosh
      - rsync
      - curl
      - python
      # Required by the retained markdownlint-cli editor package.
      - nodejs
      - stylua
      - gopls
      - delve
      - ruff
      - markdownlint-cli

- name: Bootstrap paru AUR helper
  kewlfft.aur.aur:
    use: makepkg
    name: paru
    state: present
  become: true
  become_user: "{{ username }}"

- name: Install AUR packages
  kewlfft.aur.aur:
    use: paru
    name:
      - tflint
      - marksman
    state: present
  become: true
  become_user: "{{ username }}"

- name: Install Determinate Nix
  ansible.builtin.shell:
    cmd: curl -fsSL https://install.determinate.systems/nix | sh -s -- install linux --determinate --no-confirm
  args:
    creates: /nix/var/nix/profiles/default/bin/nix

- name: Set login shell to fish
  ansible.builtin.user:
    name: "{{ username }}"
    shell: /usr/bin/fish

- name: Enable linger for persistent Herdr and Moshi user services
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ username }}"
  args:
    creates: "/var/lib/systemd/linger/{{ username }}"

- name: Ensure systemd-logind drop-in dir exists
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Keep Herdr workspaces and the Moshi user service alive after SSH logout
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/ai-dev.conf
    content: |
      [Login]
      KillUserProcesses=no
    owner: root
    group: root
    mode: '0644'
  notify: restart systemd-logind

- name: Ensure en_AU.UTF-8 line uncommented in /etc/locale.gen
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: '^\s*#?\s*en_AU\.UTF-8\s+UTF-8\s*$'
    line: 'en_AU.UTF-8 UTF-8'
    state: present
  register: locale_gen_line

- name: Regenerate locales
  ansible.builtin.command:
    cmd: locale-gen
  when: locale_gen_line.changed

- name: Set system locale to en_AU.UTF-8
  ansible.builtin.copy:
    dest: /etc/locale.conf
    content: "LANG=en_AU.UTF-8\n"
    owner: root
    group: root
    mode: '0644'
