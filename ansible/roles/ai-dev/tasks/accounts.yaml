---
- name: Configure global git identity
  community.general.git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    scope: global
  become_user: "{{ username }}"
  loop:
    - { name: "user.name", value: "{{ git_user_name }}" }
    - { name: "user.email", value: "{{ git_user_email }}" }
    - { name: "init.defaultBranch", value: "main" }
    - { name: "pull.rebase", value: "true" }
  when:
    - git_user_name is defined
    - git_user_email is defined

- name: Deploy BusinessCraft git identity
  ansible.builtin.copy:
    content: |
      [user]
          email = {{ git_businesscraft_email }}
    dest: "/home/{{ username }}/.gitconfig-businesscraft"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0600"
  when: git_businesscraft_email is defined

- name: Configure BusinessCraft conditional git identity
  community.general.git_config:
    name: "includeIf.gitdir:~/work/businesscraft/.path"
    value: "/home/{{ username }}/.gitconfig-businesscraft"
    scope: global
  become_user: "{{ username }}"
  when: git_businesscraft_email is defined

- name: Restrict global git configuration permissions
  ansible.builtin.file:
    path: "/home/{{ username }}/.gitconfig"
    state: file
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0600"
