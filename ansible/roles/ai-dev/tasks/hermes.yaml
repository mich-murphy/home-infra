---
# Hermes reads untrusted input, so it runs apart from the management user.
- name: Create the Hermes agent group
  ansible.builtin.group:
    name: "{{ ai_dev_hermes_user }}"
    state: present

- name: Create the Hermes agent user
  ansible.builtin.user:
    name: "{{ ai_dev_hermes_user }}"
    group: "{{ ai_dev_hermes_user }}"
    home: "{{ ai_dev_hermes_home }}"
    shell: /bin/bash
    create_home: true
    password_lock: true

- name: Read the management user home directory state
  ansible.builtin.stat:
    path: "/home/{{ username }}"
  register: ai_dev_management_home

- name: Verify the Hermes user cannot read the management user's home
  ansible.builtin.assert:
    that:
      - ai_dev_management_home.stat.mode is version('0750', '<=')
      - ai_dev_management_home.stat.pw_name == username
    fail_msg: >-
      /home/{{ username }} must stay owner-private so the Hermes account cannot
      read the management user's GitHub tokens, SSH keys, or agent sessions.

- name: Keep the Hermes home directory owner-private
  ansible.builtin.file:
    path: "{{ ai_dev_hermes_home }}"
    state: directory
    owner: "{{ ai_dev_hermes_user }}"
    group: "{{ ai_dev_hermes_user }}"
    mode: "0750"

- name: Ensure the Hermes SSH directory exists
  ansible.builtin.file:
    path: "{{ ai_dev_hermes_home }}/.ssh"
    state: directory
    owner: "{{ ai_dev_hermes_user }}"
    group: "{{ ai_dev_hermes_user }}"
    mode: "0700"

# lineinfile, not copy: keeps the key Moshi adds when pairing.
- name: Authorize the operator keys for the Hermes account
  ansible.builtin.lineinfile:
    path: "{{ ai_dev_hermes_home }}/.ssh/authorized_keys"
    regexp: >-
      ^{{ (item.split()[:2] | join(' ')) | regex_escape }}(?:\s.*)?\s*$
    line: "{{ item }}"
    state: present
    create: true
    owner: "{{ ai_dev_hermes_user }}"
    group: "{{ ai_dev_hermes_user }}"
    mode: "0600"
  loop: "{{ ai_dev_hermes_authorized_keys }}"
  loop_control:
    label: "{{ item.split()[2] | default('operator key') }}"

- name: Enable linger for persistent Hermes user services
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ ai_dev_hermes_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ ai_dev_hermes_user }}"

- name: Ensure the Hermes user-local executable directory exists
  ansible.builtin.file:
    path: "{{ ai_dev_hermes_home }}/.local/bin"
    state: directory
    owner: "{{ ai_dev_hermes_user }}"
    group: "{{ ai_dev_hermes_user }}"
    mode: "0755"

- name: Install the Hermes agent
  ansible.builtin.shell:
    cmd: >-
      curl -fsSL https://hermes-agent.nousresearch.com/install.sh
      | bash -s -- --skip-setup
  args:
    creates: "{{ ai_dev_hermes_home }}/.local/bin/hermes"
  become: true
  become_user: "{{ ai_dev_hermes_user }}"
  environment:
    HOME: "{{ ai_dev_hermes_home }}"
    USER: "{{ ai_dev_hermes_user }}"
    PATH: "{{ ai_dev_hermes_home }}/.local/bin:/usr/local/bin:/usr/bin"
  vars:
    ansible_python_interpreter: "{{ ai_dev_hermes_python }}"
  # Check mode does not create the account, so sudo cannot switch to it.
  when: not ansible_check_mode

- name: Install Herdr for the Hermes account
  ansible.builtin.shell:
    cmd: curl -fsSL https://herdr.dev/install.sh | sh
  args:
    creates: "{{ ai_dev_hermes_home }}/.local/bin/herdr"
  become: true
  become_user: "{{ ai_dev_hermes_user }}"
  environment:
    HOME: "{{ ai_dev_hermes_home }}"
    USER: "{{ ai_dev_hermes_user }}"
    PATH: "{{ ai_dev_hermes_home }}/.local/bin:/usr/local/bin:/usr/bin"
  vars:
    ansible_python_interpreter: "{{ ai_dev_hermes_python }}"
  when: not ansible_check_mode

- name: Install Moshi for the Hermes account
  ansible.builtin.shell:
    cmd: >-
      curl -fsSL https://getmoshi.app/install.sh
      | MOSHI_HOOK_SKIP_FIRST_RUN=1 sh
  args:
    creates: "{{ ai_dev_hermes_home }}/.local/bin/moshi-hook"
  become: true
  become_user: "{{ ai_dev_hermes_user }}"
  environment:
    HOME: "{{ ai_dev_hermes_home }}"
    USER: "{{ ai_dev_hermes_user }}"
    PATH: "{{ ai_dev_hermes_home }}/.local/bin:/usr/local/bin:/usr/bin"
  vars:
    ansible_python_interpreter: "{{ ai_dev_hermes_python }}"
  when: not ansible_check_mode

- name: Install the Moshi integration for the Hermes agent
  ansible.builtin.command:
    argv:
      - "{{ ai_dev_hermes_home }}/.local/bin/moshi-hook"
      - install
      - --target
      - "{{ ai_dev_hermes_moshi_target }}"
  become: true
  become_user: "{{ ai_dev_hermes_user }}"
  environment:
    HOME: "{{ ai_dev_hermes_home }}"
    USER: "{{ ai_dev_hermes_user }}"
    PATH: "{{ ai_dev_hermes_home }}/.local/bin:/usr/local/bin:/usr/bin"
  vars:
    ansible_python_interpreter: "{{ ai_dev_hermes_python }}"
  # Reconciles the hook files on every run, so it reports no change of its own.
  changed_when: false
  when: not ansible_check_mode

# Pairing stays manual (token from the Moshi iPhone app), but once the pairing
# secret exists the daemon is converged here so it keeps running by itself;
# linger keeps the user manager alive across logout and reboot.
- name: Check whether the Hermes account is paired with Moshi
  ansible.builtin.stat:
    path: "{{ ai_dev_hermes_home }}/.local/state/moshi/secrets.json"
  register: ai_dev_hermes_moshi_pairing

- name: Check whether the Moshi hook service unit exists
  ansible.builtin.stat:
    path: "{{ ai_dev_hermes_home }}/.config/systemd/user/moshi-hook.service"
  register: ai_dev_hermes_moshi_unit

- name: Install the Moshi hook daemon service
  ansible.builtin.command:
    argv:
      - "{{ ai_dev_hermes_home }}/.local/bin/moshi-hook"
      - service
      - install
  become: true
  become_user: "{{ ai_dev_hermes_user }}"
  environment:
    HOME: "{{ ai_dev_hermes_home }}"
    USER: "{{ ai_dev_hermes_user }}"
    PATH: "{{ ai_dev_hermes_home }}/.local/bin:/usr/local/bin:/usr/bin"
  vars:
    ansible_python_interpreter: "{{ ai_dev_hermes_python }}"
  register: ai_dev_hermes_moshi_service_install
  # moshi-hook calls `systemctl --user` itself, which cannot reach the user bus
  # over sudo; the unit file is still written, and enablement happens below.
  failed_when: >-
    ai_dev_hermes_moshi_service_install.rc != 0
    and 'user scope bus' not in (
      (
        ai_dev_hermes_moshi_service_install.stdout_lines | default([])
        + ai_dev_hermes_moshi_service_install.stderr_lines | default([])
      ) | join(' ')
    )
  changed_when: true
  when:
    - ai_dev_hermes_moshi_pairing.stat.exists
    - not ai_dev_hermes_moshi_unit.stat.exists
    - not ansible_check_mode

# The management user no longer runs its own Moshi daemon, so this account
# keeps the default 127.0.0.1:24543 gateway listen address. Remove the port
# override a previous deployment may have left behind.
- name: Remove the retired Moshi daemon gateway listen override
  ansible.builtin.file:
    path: "{{ ai_dev_hermes_home }}/.config/systemd/user/moshi-hook.service.d/gateway-listen.conf"
    state: absent
  notify: restart hermes user services

- name: Reload the Hermes user manager for the Moshi service
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - "--machine={{ ai_dev_hermes_user }}@"
      - --user
      - daemon-reload
  changed_when: false
  when:
    - ai_dev_hermes_moshi_pairing.stat.exists
    - ai_dev_hermes_moshi_unit.stat.exists or ai_dev_hermes_moshi_service_install is not skipped
    - not ansible_check_mode

- name: Read the Moshi hook service enablement
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - "--machine={{ ai_dev_hermes_user }}@"
      - --user
      - is-enabled
      - moshi-hook.service
  register: ai_dev_hermes_moshi_enabled
  changed_when: false
  failed_when: false
  when:
    - ai_dev_hermes_moshi_pairing.stat.exists
    - not ansible_check_mode

- name: Read the Moshi hook service activity
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - "--machine={{ ai_dev_hermes_user }}@"
      - --user
      - is-active
      - moshi-hook.service
  register: ai_dev_hermes_moshi_active
  changed_when: false
  failed_when: false
  when:
    - ai_dev_hermes_moshi_pairing.stat.exists
    - not ansible_check_mode

- name: Enable and start the Moshi hook daemon for the Hermes account
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - "--machine={{ ai_dev_hermes_user }}@"
      - --user
      - enable
      - --now
      - moshi-hook.service
  changed_when: true
  when:
    - ai_dev_hermes_moshi_pairing.stat.exists
    - not ansible_check_mode
    - (ai_dev_hermes_moshi_enabled.stdout | default('')) != 'enabled' or (ai_dev_hermes_moshi_active.stdout | default('')) != 'active'

- name: Ensure the Hermes configuration directory exists
  ansible.builtin.file:
    path: "{{ ai_dev_hermes_home }}/.config/hermes"
    state: directory
    owner: "{{ ai_dev_hermes_user }}"
    group: "{{ ai_dev_hermes_user }}"
    mode: "0700"

- name: Deploy the Hermes scoped credential environment
  ansible.builtin.copy:
    content: |
      DOCKER_HOST={{ ai_dev_hermes_docker_host }}
      PROXMOX_ENDPOINT={{ ai_dev_hermes_proxmox_endpoint }}
      {% if ai_dev_hermes_proxmox_credentials_present %}
      PROXMOX_TOKEN_ID={{ hermes_proxmox_token_id }}
      PROXMOX_TOKEN_SECRET={{ hermes_proxmox_token_secret }}
      {% endif %}
      {% if ai_dev_hermes_github_credentials_present %}
      GH_TOKEN={{ hermes_github_token }}
      GITHUB_TOKEN={{ hermes_github_token }}
      {% endif %}
    dest: "{{ ai_dev_hermes_home }}/.config/hermes/env"
    owner: "{{ ai_dev_hermes_user }}"
    group: "{{ ai_dev_hermes_user }}"
    mode: "0600"
  no_log: true
  notify: restart hermes user services

- name: Report Hermes credentials still missing from the vault
  ansible.builtin.debug:
    msg: >-
      Hermes is installed without
      {{ _ai_dev_hermes_missing | join(' and ') }} access. Add the matching
      variables to group_vars/secrets.yaml and re-run.
  vars:
    _ai_dev_hermes_missing: >-
      {{ (['Proxmox'] if not ai_dev_hermes_proxmox_credentials_present else [])
         + (['GitHub'] if not ai_dev_hermes_github_credentials_present else []) }}
  when: _ai_dev_hermes_missing | length > 0

- name: Load the scoped credentials into the Hermes login environment
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (ai-dev role).
      if [ -r "$HOME/.config/hermes/env" ]; then
          set -a
          . "$HOME/.config/hermes/env"
          set +a
      fi
      PATH="$HOME/.local/bin:$PATH"
      export PATH
    dest: "{{ ai_dev_hermes_home }}/.profile"
    owner: "{{ ai_dev_hermes_user }}"
    group: "{{ ai_dev_hermes_user }}"
    mode: "0644"

# Bash login shells read .bash_profile and stop, so .profile alone never loads.
- name: Point the Hermes login shell at the managed profile
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (ai-dev role).
      [ -f "$HOME/.bashrc" ] && . "$HOME/.bashrc"
      [ -f "$HOME/.profile" ] && . "$HOME/.profile"
    dest: "{{ ai_dev_hermes_home }}/.bash_profile"
    owner: "{{ ai_dev_hermes_user }}"
    group: "{{ ai_dev_hermes_user }}"
    mode: "0644"

# Herdr panes are interactive but not login shells, so they miss .bash_profile.
- name: Load the managed profile in interactive Hermes shells
  ansible.builtin.blockinfile:
    path: "{{ ai_dev_hermes_home }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: hermes profile"
    block: |
      [ -f "$HOME/.profile" ] && . "$HOME/.profile"
    create: true
    owner: "{{ ai_dev_hermes_user }}"
    group: "{{ ai_dev_hermes_user }}"
    mode: "0644"

# Ad-hoc Hermes upkeep runs through sudo from the management user; neither a
# session on the agent account nor a sudo entry for it is ever needed.
- name: Ensure the management user's local executable directory exists
  ansible.builtin.file:
    path: "/home/{{ username }}/.local/bin"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0755"

- name: Install the hermes maintenance command
  ansible.builtin.copy:
    src: hermes-maintenance
    dest: "/home/{{ username }}/.local/bin/hermes-maintenance"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0755"

# The retired command maintained the management user's own coding-agent
# toolchain, which no longer exists on this host.
- name: Remove the retired ai-dev maintenance command
  ansible.builtin.file:
    path: "/home/{{ username }}/.local/bin/ai-dev-maintenance"
    state: absent

# Each Moshi reconnect spawns a new mosh-server; without a timeout the old ones
# linger forever. Herdr holds the real session, so mosh need not outlive it.
# The trailing `Match all` is required: sshd_config includes drop-ins on line 2,
# so an unclosed Match block would swallow the rest of the hardened config.
- name: Bound the Hermes mosh server lifetime
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/61-hermes-mosh-timeout.conf
    content: |
      Match User {{ ai_dev_hermes_user }}
          SetEnv MOSH_SERVER_NETWORK_TMOUT={{ ai_dev_hermes_mosh_timeout }}
      Match all
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: restart ai-dev sshd

- name: Read the installed Hermes version
  ansible.builtin.command:
    argv:
      - "{{ ai_dev_hermes_home }}/.local/bin/hermes"
      - --version
  become: true
  become_user: "{{ ai_dev_hermes_user }}"
  environment:
    HOME: "{{ ai_dev_hermes_home }}"
    USER: "{{ ai_dev_hermes_user }}"
    PATH: "{{ ai_dev_hermes_home }}/.local/bin:/usr/local/bin:/usr/bin"
  vars:
    ansible_python_interpreter: "{{ ai_dev_hermes_python }}"
  register: ai_dev_hermes_version
  changed_when: false
  when: not ansible_check_mode

- name: Verify the Hermes agent responds
  ansible.builtin.assert:
    that:
      - ai_dev_hermes_version.stdout | length > 0
    fail_msg: The Hermes agent did not report a version.
  when: not ansible_check_mode

# Updates stay opt in per run: the agent tracks upstream origin/main, so the
# play refreshes the toolchain only when the operator asks. Version deltas,
# not installer output, decide whether the user services need a restart.
- name: Read the Hermes agent version before update
  ansible.builtin.command:
    argv:
      - "{{ ai_dev_hermes_home }}/.local/bin/hermes"
      - --version
  become: true
  become_user: "{{ ai_dev_hermes_user }}"
  environment:
    HOME: "{{ ai_dev_hermes_home }}"
    USER: "{{ ai_dev_hermes_user }}"
    PATH: "{{ ai_dev_hermes_home }}/.local/bin:/usr/local/bin:/usr/bin"
  vars:
    ansible_python_interpreter: "{{ ai_dev_hermes_python }}"
  register: ai_dev_hermes_agent_version_before
  changed_when: false
  when:
    - ai_dev_hermes_update | bool
    - not ansible_check_mode

# `hermes update` exits 1 when its own in-process gateway restart fails after
# a successful update (mixed stale/fresh imports); the output marker separates
# that case from a real update failure, and our handler restarts the gateway
# through systemd instead.
- name: Update the Hermes agent
  ansible.builtin.command:
    argv:
      - "{{ ai_dev_hermes_home }}/.local/bin/hermes"
      - update
  become: true
  become_user: "{{ ai_dev_hermes_user }}"
  environment:
    HOME: "{{ ai_dev_hermes_home }}"
    USER: "{{ ai_dev_hermes_user }}"
    PATH: "{{ ai_dev_hermes_home }}/.local/bin:/usr/local/bin:/usr/bin"
  vars:
    ansible_python_interpreter: "{{ ai_dev_hermes_python }}"
  register: ai_dev_hermes_agent_update
  changed_when: false
  failed_when: >-
    ai_dev_hermes_agent_update.rc != 0
    and 'Update complete!' not in ai_dev_hermes_agent_update.stdout
  when:
    - ai_dev_hermes_update | bool
    - not ansible_check_mode

- name: Read the Hermes agent version after update
  ansible.builtin.command:
    argv:
      - "{{ ai_dev_hermes_home }}/.local/bin/hermes"
      - --version
  become: true
  become_user: "{{ ai_dev_hermes_user }}"
  environment:
    HOME: "{{ ai_dev_hermes_home }}"
    USER: "{{ ai_dev_hermes_user }}"
    PATH: "{{ ai_dev_hermes_home }}/.local/bin:/usr/local/bin:/usr/bin"
  vars:
    ansible_python_interpreter: "{{ ai_dev_hermes_python }}"
  register: ai_dev_hermes_agent_version_after
  changed_when: >-
    ai_dev_hermes_agent_version_after.stdout
    != ai_dev_hermes_agent_version_before.stdout
  notify: restart hermes user services
  when:
    - ai_dev_hermes_update | bool
    - not ansible_check_mode

- name: Read the Herdr version before update
  ansible.builtin.command:
    argv:
      - "{{ ai_dev_hermes_home }}/.local/bin/herdr"
      - --version
  become: true
  become_user: "{{ ai_dev_hermes_user }}"
  environment:
    HOME: "{{ ai_dev_hermes_home }}"
    USER: "{{ ai_dev_hermes_user }}"
    PATH: "{{ ai_dev_hermes_home }}/.local/bin:/usr/local/bin:/usr/bin"
  vars:
    ansible_python_interpreter: "{{ ai_dev_hermes_python }}"
  register: ai_dev_hermes_herdr_version_before
  changed_when: false
  when:
    - ai_dev_hermes_update | bool
    - not ansible_check_mode

- name: Update Herdr for the Hermes account
  ansible.builtin.shell:
    cmd: curl -fsSL https://herdr.dev/install.sh | sh
  become: true
  become_user: "{{ ai_dev_hermes_user }}"
  environment:
    HOME: "{{ ai_dev_hermes_home }}"
    USER: "{{ ai_dev_hermes_user }}"
    PATH: "{{ ai_dev_hermes_home }}/.local/bin:/usr/local/bin:/usr/bin"
  vars:
    ansible_python_interpreter: "{{ ai_dev_hermes_python }}"
  changed_when: false
  when:
    - ai_dev_hermes_update | bool
    - not ansible_check_mode

- name: Read the Herdr version after update
  ansible.builtin.command:
    argv:
      - "{{ ai_dev_hermes_home }}/.local/bin/herdr"
      - --version
  become: true
  become_user: "{{ ai_dev_hermes_user }}"
  environment:
    HOME: "{{ ai_dev_hermes_home }}"
    USER: "{{ ai_dev_hermes_user }}"
    PATH: "{{ ai_dev_hermes_home }}/.local/bin:/usr/local/bin:/usr/bin"
  vars:
    ansible_python_interpreter: "{{ ai_dev_hermes_python }}"
  register: ai_dev_hermes_herdr_version_after
  changed_when: >-
    ai_dev_hermes_herdr_version_after.stdout
    != ai_dev_hermes_herdr_version_before.stdout
  when:
    - ai_dev_hermes_update | bool
    - not ansible_check_mode

- name: Read the Moshi version before update
  ansible.builtin.command:
    argv:
      - "{{ ai_dev_hermes_home }}/.local/bin/moshi-hook"
      - --version
  become: true
  become_user: "{{ ai_dev_hermes_user }}"
  environment:
    HOME: "{{ ai_dev_hermes_home }}"
    USER: "{{ ai_dev_hermes_user }}"
    PATH: "{{ ai_dev_hermes_home }}/.local/bin:/usr/local/bin:/usr/bin"
  vars:
    ansible_python_interpreter: "{{ ai_dev_hermes_python }}"
  register: ai_dev_hermes_moshi_version_before
  changed_when: false
  when:
    - ai_dev_hermes_update | bool
    - not ansible_check_mode

- name: Update Moshi for the Hermes account
  ansible.builtin.shell:
    cmd: >-
      curl -fsSL https://getmoshi.app/install.sh
      | MOSHI_HOOK_SKIP_FIRST_RUN=1 sh
  become: true
  become_user: "{{ ai_dev_hermes_user }}"
  environment:
    HOME: "{{ ai_dev_hermes_home }}"
    USER: "{{ ai_dev_hermes_user }}"
    PATH: "{{ ai_dev_hermes_home }}/.local/bin:/usr/local/bin:/usr/bin"
  vars:
    ansible_python_interpreter: "{{ ai_dev_hermes_python }}"
  changed_when: false
  when:
    - ai_dev_hermes_update | bool
    - not ansible_check_mode

- name: Read the Moshi version after update
  ansible.builtin.command:
    argv:
      - "{{ ai_dev_hermes_home }}/.local/bin/moshi-hook"
      - --version
  become: true
  become_user: "{{ ai_dev_hermes_user }}"
  environment:
    HOME: "{{ ai_dev_hermes_home }}"
    USER: "{{ ai_dev_hermes_user }}"
    PATH: "{{ ai_dev_hermes_home }}/.local/bin:/usr/local/bin:/usr/bin"
  vars:
    ansible_python_interpreter: "{{ ai_dev_hermes_python }}"
  register: ai_dev_hermes_moshi_version_after
  changed_when: >-
    ai_dev_hermes_moshi_version_after.stdout
    != ai_dev_hermes_moshi_version_before.stdout
  notify: restart hermes user services
  when:
    - ai_dev_hermes_update | bool
    - not ansible_check_mode

# The integration reconcile earlier in this file ran before any update; run
# it again so a Moshi update does not leave stale hook files until next play.
- name: Reconcile the Moshi integration after updates
  ansible.builtin.command:
    argv:
      - "{{ ai_dev_hermes_home }}/.local/bin/moshi-hook"
      - install
      - --target
      - "{{ ai_dev_hermes_moshi_target }}"
  become: true
  become_user: "{{ ai_dev_hermes_user }}"
  environment:
    HOME: "{{ ai_dev_hermes_home }}"
    USER: "{{ ai_dev_hermes_user }}"
    PATH: "{{ ai_dev_hermes_home }}/.local/bin:/usr/local/bin:/usr/bin"
  vars:
    ansible_python_interpreter: "{{ ai_dev_hermes_python }}"
  changed_when: false
  when:
    - ai_dev_hermes_update | bool
    - not ansible_check_mode

# Apply any notified restarts now, then verify the services actually came up
# on the updated code: hermes cannot prove that during its own update.
- name: Apply notified hermes service restarts before verification
  ansible.builtin.meta: flush_handlers

- name: Discover the hermes user services after update
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - "--machine={{ ai_dev_hermes_user }}@"
      - --user
      - --no-legend
      - --no-pager
      - list-unit-files
      - --state=enabled
      - "hermes*.service"
      - moshi-hook.service
  register: ai_dev_hermes_post_update_units
  changed_when: false
  failed_when: ai_dev_hermes_post_update_units.rc not in [0, 1]
  when:
    - ai_dev_hermes_update | bool
    - not ansible_check_mode

- name: Verify the hermes user services are active after update
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - "--machine={{ ai_dev_hermes_user }}@"
      - --user
      - is-active
      - "{{ item.split()[0] }}"
  loop: "{{ ai_dev_hermes_post_update_units.stdout_lines | default([]) }}"
  changed_when: false
  when:
    - ai_dev_hermes_update | bool
    - not ansible_check_mode
