---
- name: Ensure the development directory exists
  ansible.builtin.file:
    path: "/home/{{ username }}/dev"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0755"

- name: Clone the Nix configuration when missing
  ansible.builtin.git:
    repo: https://github.com/mich-murphy/nix-config.git
    dest: "/home/{{ username }}/dev/nix-config"
    version: main
    update: false
    force: false
    single_branch: true
  become: true
  become_user: "{{ username }}"
  check_mode: false

- name: Read the Nix configuration branch
  ansible.builtin.command:
    argv:
      - /usr/bin/git
      - branch
      - --show-current
    chdir: "/home/{{ username }}/dev/nix-config"
  become: true
  become_user: "{{ username }}"
  register: ai_dev_nix_config_branch
  changed_when: false
  check_mode: false

- name: Require the Nix configuration main branch
  ansible.builtin.assert:
    that:
      - ai_dev_nix_config_branch.stdout == "main"
    fail_msg: >-
      The ai-dev Nix configuration must remain on main; found
      {{ ai_dev_nix_config_branch.stdout | default('no branch', true) }}.

- name: Read the Nix configuration worktree status
  ansible.builtin.command:
    argv:
      - /usr/bin/git
      - status
      - --porcelain
    chdir: "/home/{{ username }}/dev/nix-config"
  become: true
  become_user: "{{ username }}"
  register: ai_dev_nix_config_status
  changed_when: false
  check_mode: false

- name: Require a clean Nix configuration worktree
  ansible.builtin.assert:
    that:
      - ai_dev_nix_config_status.stdout == ""
    fail_msg: >-
      Refusing to deploy with local changes in
      /home/{{ username }}/dev/nix-config.

- name: Fetch the Nix configuration deployment branch
  ansible.builtin.command:
    argv:
      - /usr/bin/git
      - fetch
      - origin
      - main
    chdir: "/home/{{ username }}/dev/nix-config"
  become: true
  become_user: "{{ username }}"
  changed_when: false
  check_mode: false

- name: Fast-forward the Nix configuration deployment branch
  ansible.builtin.command:
    argv:
      - /usr/bin/git
      - merge
      - --ff-only
      - origin/main
    chdir: "/home/{{ username }}/dev/nix-config"
  become: true
  become_user: "{{ username }}"
  register: ai_dev_nix_config_fast_forward
  changed_when: "'Already up to date.' not in ai_dev_nix_config_fast_forward.stdout"
  check_mode: false

- name: Read the local and deployment Nix configuration revisions
  ansible.builtin.command:
    argv:
      - /usr/bin/git
      - rev-parse
      - HEAD
      - origin/main
    chdir: "/home/{{ username }}/dev/nix-config"
  become: true
  become_user: "{{ username }}"
  register: ai_dev_nix_config_revisions
  changed_when: false
  check_mode: false

- name: Require the exact Nix configuration deployment revision
  ansible.builtin.assert:
    that:
      - ai_dev_nix_config_revisions.stdout_lines | length == 2
      - ai_dev_nix_config_revisions.stdout_lines[0] ==
        ai_dev_nix_config_revisions.stdout_lines[1]
    fail_msg: >-
      The ai-dev Nix configuration is not exactly origin/main; refusing to
      deploy local commits.

- name: Build the ai-dev Home Manager activation package
  ansible.builtin.command:
    argv:
      - /nix/var/nix/profiles/default/bin/nix
      - build
      - --no-link
      - '.#homeConfigurations."michael@ai-dev".activationPackage'
    chdir: "/home/{{ username }}/dev/nix-config"
  become: true
  become_user: "{{ username }}"
  environment:
    HOME: "/home/{{ username }}"
  changed_when: false
  check_mode: false

- name: Check whether Home Manager has replaced the legacy shell configuration
  ansible.builtin.stat:
    path: "/home/{{ username }}/.local/state/home-manager/ai-dev-bootstrapped"
  register: ai_dev_home_manager_bootstrap

- name: Find legacy Fisher plugin files
  ansible.builtin.find:
    paths: "/home/{{ username }}/.config/fish"
    recurse: true
    file_type: file
    hidden: true
    patterns:
      - fisher.fish
      - autopair.fish
      - _autopair*.fish
      - sponge*.fish
      - __sponge*.fish
  register: ai_dev_legacy_fish_plugins
  when: not ai_dev_home_manager_bootstrap.stat.exists

- name: Remove legacy Fisher plugin files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ ai_dev_legacy_fish_plugins.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when: not ai_dev_home_manager_bootstrap.stat.exists

- name: Remove configuration files replaced by Home Manager
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/home/{{ username }}/.config/fish/config.fish"
    - "/home/{{ username }}/.config/fish/fish_plugins"
    - "/home/{{ username }}/.config/starship.toml"
    - "/home/{{ username }}/.gitconfig"
    - "/home/{{ username }}/.gitconfig-personal"
    - "/home/{{ username }}/.gitconfig-businesscraft"
    - "/home/{{ username }}/.tmux.conf"
    - "/home/{{ username }}/.config/fish/conf.d/anthropic.fish"
    - /usr/local/bin/osc52-copy
  when: not ai_dev_home_manager_bootstrap.stat.exists

- name: Activate the ai-dev Home Manager generation when it changed
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      activation="$(
        /nix/var/nix/profiles/default/bin/nix build \
          --print-out-paths \
          --no-link \
          '.#homeConfigurations."michael@ai-dev".activationPackage'
      )"
      current="$(
        readlink -f "$HOME/.local/state/nix/profiles/home-manager" 2>/dev/null ||
          true
      )"

      if
        [[ "$AI_DEV_HOME_MANAGER_BOOTSTRAPPED" == "1" ]] &&
          [[ "$current" == "$activation" ]]
      then
        echo "Home Manager generation is current"
        exit 0
      fi

      "$activation/activate"
      echo "Home Manager generation activated"
    executable: /bin/bash
    chdir: "/home/{{ username }}/dev/nix-config"
  become: true
  become_user: "{{ username }}"
  environment:
    AI_DEV_HOME_MANAGER_BOOTSTRAPPED: >-
      {{
        ai_dev_home_manager_bootstrap.stat.exists |
        ternary('1', '0')
      }}
    HOME: "/home/{{ username }}"
  register: ai_dev_home_manager_activation
  changed_when: >-
    'Home Manager generation activated' in
    ai_dev_home_manager_activation.stdout
  when: not ansible_check_mode

- name: Ensure the Home Manager migration state directory exists
  ansible.builtin.file:
    path: "/home/{{ username }}/.local/state/home-manager"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0700"
  when: not ansible_check_mode

- name: Record completion of the Home Manager migration
  ansible.builtin.file:
    path: "/home/{{ username }}/.local/state/home-manager/ai-dev-bootstrapped"
    state: touch
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0600"
    modification_time: preserve
    access_time: preserve
  when: not ansible_check_mode

- name: Remove the separately installed OpenCode binary
  ansible.builtin.file:
    path: "/home/{{ username }}/.opencode/bin/opencode"
    state: absent
  when: not ansible_check_mode

- name: Remove CLI packages replaced by Home Manager
  community.general.pacman:
    state: absent
    name:
      - starship
      - github-cli
      - lazygit
      - ripgrep
      - fd
      - bat
      - eza
      - zoxide
      - direnv
      - just
      - fzf
      - npm
      - btop
      - sd
      - jq
      - tree
      - procs
      - wget
  when: not ansible_check_mode

- name: Remove AUR CLI packages replaced by Home Manager
  kewlfft.aur.aur:
    use: paru
    name:
      - ouch
      - fisher
    state: absent
  become: true
  become_user: "{{ username }}"
  when: not ansible_check_mode
