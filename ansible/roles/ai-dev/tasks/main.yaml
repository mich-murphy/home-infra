---
- name: Enforce the ai-dev host and Tailscale identity
  ansible.builtin.import_tasks: identity.yaml

- name: System bootstrap (packages, logind, locale)
  ansible.builtin.import_tasks: bootstrap.yaml

- name: Configure host firewall
  ansible.builtin.import_tasks: firewall.yaml

- name: Memory protection and filesystem maintenance timers
  ansible.builtin.import_tasks: system-maintenance.yaml

# Destructive and off by default; docs/ai-dev.md holds the runbook.
- name: Decommission the retired Hermes agent account
  ansible.builtin.import_tasks: hermes-decommission.yaml
  when: ai_dev_hermes_decommission | bool
  tags:
    - hermes-decommission
