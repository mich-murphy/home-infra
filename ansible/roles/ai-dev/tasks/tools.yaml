---
- name: Read the installed Node.js version
  ansible.builtin.command:
    argv:
      - /usr/bin/env
      - node
      - --version
  environment:
    PATH: "/home/{{ username }}/.nix-profile/bin:/usr/bin"
  register: ai_dev_node_version
  changed_when: false
  check_mode: false

- name: Require Node.js 22.19 or newer for Pi
  ansible.builtin.assert:
    that:
      - "ai_dev_node_version.stdout | regex_replace('^v', '') is version('22.19.0', '>=')"
    fail_msg: "Pi requires Node.js >=22.19.0; found {{ ai_dev_node_version.stdout }}."

- name: Ensure the ai-dev toolchain is present
  ansible.builtin.command:
    argv:
      - "/home/{{ username }}/.nix-profile/bin/ai-dev-maintenance"
      - ensure-present
  become: true
  become_user: "{{ username }}"
  environment:
    HOME: "/home/{{ username }}"
    USER: "{{ username }}"
    PATH: "/home/{{ username }}/.local/bin:/home/{{ username }}/.nix-profile/bin:/nix/var/nix/profiles/default/bin:/usr/local/bin:/usr/bin"
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[username][1] }}"
  register: ai_dev_maintenance_ensure
  changed_when: >-
    'not installed ->' in ai_dev_maintenance_ensure.stdout
    or 'Pi package install' in ai_dev_maintenance_ensure.stdout
  when: not ansible_check_mode

- name: Verify the ai-dev toolchain and Moshi runtime
  ansible.builtin.command:
    argv:
      - "/home/{{ username }}/.nix-profile/bin/ai-dev-maintenance"
      - status
  become: true
  become_user: "{{ username }}"
  environment:
    HOME: "/home/{{ username }}"
    USER: "{{ username }}"
    PATH: "/home/{{ username }}/.local/bin:/home/{{ username }}/.nix-profile/bin:/nix/var/nix/profiles/default/bin:/usr/local/bin:/usr/bin"
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[username][1] }}"
  changed_when: false
  when: not ansible_check_mode
