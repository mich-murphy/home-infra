---
- name: Ensure config directories exist
  ansible.builtin.file:
    path: "/home/{{ username }}/.config/{{ item }}"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: '0755'
  become_user: "{{ username }}"
  loop:
    - fish

- name: Remove legacy tmux and automated API-key configuration
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/osc52-copy
    - "/home/{{ username }}/.tmux.conf"
    - "/home/{{ username }}/.config/fish/conf.d/anthropic.fish"

- name: Deploy fish config
  ansible.builtin.template:
    src: fish/config.fish.j2
    dest: "/home/{{ username }}/.config/fish/config.fish"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: '0644'
  become_user: "{{ username }}"

- name: Deploy fisher plugin manifest
  ansible.builtin.copy:
    dest: "/home/{{ username }}/.config/fish/fish_plugins"
    content: |
      jorgebucaran/fisher
      jorgebucaran/autopair.fish
      meaningful-ooo/sponge
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: '0644'
  become_user: "{{ username }}"
  register: fish_plugins_manifest

- name: Sync fisher plugins from manifest
  ansible.builtin.command:
    cmd: fish -c 'fisher update'
  become_user: "{{ username }}"
  when: fish_plugins_manifest.changed
  changed_when: true

- name: Deploy starship config
  ansible.builtin.template:
    src: starship.toml.j2
    dest: "/home/{{ username }}/.config/starship.toml"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: '0644'
  become_user: "{{ username }}"
