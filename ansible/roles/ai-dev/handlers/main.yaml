---
- name: restart systemd-logind
  ansible.builtin.systemd_service:
    name: systemd-logind
    state: restarted

- name: restart ai-dev sshd
  ansible.builtin.systemd_service:
    name: sshd
    state: restarted

- name: restart earlyoom
  ansible.builtin.systemd_service:
    name: earlyoom.service
    state: restarted
