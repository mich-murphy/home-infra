---
- name: restart systemd-logind
  ansible.builtin.systemd_service:
    name: systemd-logind
    state: restarted

- name: restart ai-dev sshd
  ansible.builtin.systemd_service:
    name: sshd
    state: restarted

- name: restart earlyoom
  ansible.builtin.systemd_service:
    name: earlyoom.service
    state: restarted

# systemd holds a mask in memory until it re-reads the unit tree, so removing
# the mask files leaves the units reporting masked for the rest of the boot.
- name: reload systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true
