---
- name: Tag production VLANs on the trunk ports
  community.routeros.api_modify:
    path: interface bridge vlan
    handle_absent_entries: ignore
    data:
      - bridge: "{{ routeros_bridge }}"
        vlan-ids: "{{ item.id }}"
        tagged: "{{ ([routeros_bridge] + routeros_trunk_ports) | join(',') }}"
        untagged: >-
          {{
            routeros_mad_villainy_port
            if item.name == routeros_mad_villainy_vlan.name
            else omit
          }}
        comment: "{{ item.name }} (managed: routeros role)"
  loop: "{{ routeros_vlans }}"
  loop_control:
    label: "{{ item.name }} ({{ item.id }})"

# Native MGMT stays untagged; do not add the bridge as a tagged VLAN 1 member.
- name: VLAN 1 (native MGMT) membership — untagged access ports only (no bridge tag)
  community.routeros.api_modify:
    path: interface bridge vlan
    handle_absent_entries: ignore
    data:
      - bridge: "{{ routeros_bridge }}"
        vlan-ids: 1
        untagged: "{{ routeros_vlan1_untagged_ports | join(',') }}"
        comment: "mgmt native (managed: routeros role)"

- name: Set PVID=1 (MGMT native) on the untagged access ports
  community.routeros.api_modify:
    path: interface bridge port
    handle_absent_entries: ignore
    data:
      - bridge: "{{ routeros_bridge }}"
        interface: "{{ item }}"
        pvid: 1
  loop: "{{ routeros_mgmt_untagged_ports }}"

- name: Configure ether6 as the untagged Mad Villainy access port
  community.routeros.api_modify:
    path: interface bridge port
    handle_absent_entries: ignore
    data:
      - bridge: "{{ routeros_bridge }}"
        interface: "{{ routeros_mad_villainy_port }}"
        pvid: "{{ routeros_mad_villainy_vlan.id }}"

# Recovery mode is an explicit variable override; production defaults to true.
- name: Reconcile bridge VLAN filtering state (LOCKOUT RISK)
  community.routeros.api_modify:
    path: interface bridge
    handle_absent_entries: ignore
    data:
      - name: "{{ routeros_bridge }}"
        vlan-filtering: "{{ routeros_enable_vlan_filtering | bool }}"
  tags: [vlan-filtering]
