---
- name: Verify Docker Engine resolves
  ansible.builtin.command:
    cmd: docker version
  changed_when: false

- name: Verify Docker Compose resolves
  ansible.builtin.command:
    cmd: docker compose version
  changed_when: false

- name: Verify required NFS targets are mounted
  ansible.builtin.command:
    cmd: "findmnt -rn --target {{ item.local_path }}"
  changed_when: false
  loop: "{{ nfs_mounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Read active Docker published-port policy
  ansible.builtin.command:
    cmd: iptables -S DOCKER-USER
  register: docker_published_port_policy
  changed_when: false

- name: Verify Docker published-port allowlist entries
  ansible.builtin.assert:
    that:
      - >-
        docker_published_port_policy.stdout_lines
        | select('search', '-p ' ~ item.proto ~ ' .*--ctorigdstport ' ~ item.port ~ ' --ctdir ORIGINAL -j RETURN$')
        | list
        | length == 1
    fail_msg: "Docker published port {{ item.port }}/{{ item.proto }} is not allowlisted exactly once."
  loop: "{{ docker_published_ports }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto }}"

- name: Verify direct fallback ports require Tailscale ingress
  ansible.builtin.assert:
    that:
      - _fallback_returns | length == 1
      - _fallback_returns | select('search', ' -i tailscale0 ') | list | length == 1
      - _fallback_returns | select('search', ' -s 100\\.64\\.0\\.0/10 ') | list | length == 1
      - _fallback_returns | select('search', ' --ctdir ORIGINAL ') | list | length == 1
      - >-
        docker_published_port_policy.stdout_lines
        | select('search', ' -i ' ~ docker_external_interface ~ ' .*--ctstate NEW -j DROP$')
        | list | length == 1
    fail_msg: >-
      Direct fallback {{ item.port }}/{{ item.proto }} must have exactly one
      allow rule, restricted to tailscale0 and the tailnet IPv4 range; unlisted
      new traffic on the external interface must remain dropped.
  vars:
    _fallback_returns: >-
      {{ docker_published_port_policy.stdout_lines
         | select('search', ' -p ' ~ item.proto ~ ' ')
         | select('search', ' --ctorigdstport ' ~ item.port ~ ' ')
         | select('search', ' -j RETURN$') | list }}
  loop: "{{ docker_tailscale_fallback_ports }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto }}"

- name: Verify the agent socket proxy is pinned to its single client
  ansible.builtin.assert:
    that:
      - >-
        docker_published_port_policy.stdout_lines
        | select('search', '^-A DOCKER-USER -s .* --ctorigdstport ' ~ docker_agent_proxy_port ~ ' --ctdir ORIGINAL -j RETURN$')
        | list | length == 1
      - >-
        docker_published_port_policy.stdout_lines
        | select('search', '^-A DOCKER-USER -p tcp .*--ctorigdstport ' ~ docker_agent_proxy_port ~ ' --ctdir ORIGINAL -j DROP$')
        | list | length == 1
    fail_msg: >-
      The agent socket proxy port must admit exactly one source address and
      drop every other client.

- name: Read the agent socket proxy bind address
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - "--format={{ '{{json .HostConfig.PortBindings}}' }}"
      - docker-socket-proxy-agent
  register: docker_agent_proxy_bindings
  changed_when: false

- name: Verify the agent observer never binds every interface
  ansible.builtin.assert:
    that:
      - "'0.0.0.0' not in docker_agent_proxy_bindings.stdout"
      - "'\"HostIp\":\"\"' not in docker_agent_proxy_bindings.stdout"
      - "'100.' in docker_agent_proxy_bindings.stdout"
    fail_msg: >-
      The agent observer must publish only on the docker-host tailnet address,
      never on all interfaces.

- name: Read agent observer mounts
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - "--format={{ '{{json .Mounts}}' }}"
      - docker-socket-proxy-agent
  register: docker_agent_observer_mounts
  changed_when: false

- name: Verify the agent observer has no Docker socket
  ansible.builtin.assert:
    that:
      - "'docker.sock' not in docker_agent_observer_mounts.stdout"
    fail_msg: The exposed agent observer must not have a Docker socket mount.

- name: Read deployed observer source checksum
  ansible.builtin.stat:
    path: "{{ docker_bootstrap_dir }}/agent-observer/observer.py"
    checksum_algorithm: sha256
  register: docker_agent_observer_deployed_source

- name: Read observer service configuration checksum
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - "--format={{ '{{json .Config.Env}}' }}"
      - docker-socket-proxy-agent
  register: docker_agent_observer_environment
  changed_when: false

- name: Verify running observer matches deployed source
  ansible.builtin.assert:
    that:
      - >-
        ('OBSERVER_SOURCE_SHA256=' ~ docker_agent_observer_deployed_source.stat.checksum)
        in docker_agent_observer_environment.stdout
    fail_msg: >-
      The running observer must carry the deployed source checksum so Compose
      cannot retain a stale process after a bind-mounted source update.

- name: Verify Docker published-port policy ends fail-closed
  ansible.builtin.assert:
    that:
      - "docker_published_port_policy.stdout_lines[-2] is search('--ctstate NEW -j DROP$')"
      - "docker_published_port_policy.stdout_lines[-1] == '-A DOCKER-USER -j RETURN'"
    fail_msg: Docker published-port policy must drop unlisted new traffic before its final return.

- name: Verify bootstrap Compose configuration renders
  ansible.builtin.command:
    cmd: docker compose config --quiet
    chdir: "{{ docker_bootstrap_dir }}"
  changed_when: false

- name: Verify bootstrap containers are ready
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - "{{ item }}"
  register: docker_bootstrap_container
  changed_when: false
  until:
    - docker_bootstrap_container.rc == 0
    - (docker_bootstrap_container.stdout | from_json | first).State.Status == 'running'
    - >-
      (docker_bootstrap_container.stdout | from_json | first).State.Health is not defined
      or (docker_bootstrap_container.stdout | from_json | first).State.Health.Status == 'healthy'
  retries: 36
  delay: 5
  loop: "{{ docker_bootstrap_containers }}"
  loop_control:
    label: "{{ item }}"

- name: Probe agent observer denied routes after readiness
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - docker-socket-proxy-agent
      - python3
      - -c
      - |
        import http.client
        checks = [
            ("POST", "/containers/json", 405),
            ("GET", "/containers/json?labels=probe", 400),
            ("GET", "/containers/name/logs", 404),
        ]
        for method, path, expected in checks:
            connection = http.client.HTTPConnection("127.0.0.1", 2375, timeout=5)
            connection.request(method, path)
            response = connection.getresponse()
            assert response.status == expected, (method, path, response.status)
            response.read()
            connection.close()
  register: docker_agent_observer_denied_routes
  changed_when: false
  no_log: true
