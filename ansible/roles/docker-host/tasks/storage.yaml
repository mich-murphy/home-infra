---
- name: Install NFS requirements
  ansible.builtin.apt:
    name: nfs-common
    state: present
    lock_timeout: 300

- name: Ensure Docker workload groups exist
  ansible.builtin.group:
    name: "{{ item.name }}"
    gid: "{{ item.gid }}"
    state: present
  loop:
    - { name: photos, gid: 1210 }
    - { name: media, gid: 1215 }

- name: Ensure Docker workload users exist
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid }}"
    groups: "{{ item.name }}"
    create_home: false
    system: true
    append: true
  loop:
    - { name: photos, uid: 1210 }
    - { name: media, uid: 1215 }

- name: Ensure NFS mount directories exist
  ansible.builtin.file:
    path: "{{ item.local_path }}"
    state: directory
  loop: "{{ nfs_mounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Persist active NFS fstab entries
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: "^{{ item.nfs_share | regex_escape }}\\s+{{ item.local_path | regex_escape }}\\s+"
    line: "{{ item.nfs_share }} {{ item.local_path }} nfs4 {{ nfs_mount_opts }} 0 0"
    create: true
  register: active_nfs_fstab_results
  loop: "{{ nfs_mounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Reload systemd after NFS fstab changes
  ansible.builtin.systemd:
    daemon_reload: true
  when: active_nfs_fstab_results is changed

- name: Check active NFS mount state
  ansible.builtin.command:
    cmd: "findmnt -rn --target {{ item.local_path }}"
  register: active_nfs_mount_state
  changed_when: false
  check_mode: false
  failed_when: active_nfs_mount_state.rc not in [0, 1]
  loop: "{{ nfs_mounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Mount inactive NFS shares
  ansible.builtin.command:
    cmd: "mount {{ item.item.local_path }}"
  changed_when: true
  when: item.rc == 1
  loop: "{{ active_nfs_mount_state.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Remount NFS shares after fstab changes
  ansible.builtin.command:
    cmd: "mount -o remount {{ item.item.local_path }}"
  changed_when: true
  when: item.changed
  loop: "{{ active_nfs_fstab_results.results }}"
  loop_control:
    label: "{{ item.item.name }}"
