---
- name: install firewall
  ansible.builtin.apt:
    name: ufw
    state: present
    lock_timeout: 300

- name: enable ufw
  community.general.ufw:
    state: enabled

- name: deny incoming traffic
  community.general.ufw:
    default: deny
    direction: incoming

- name: allow outgoing traffic
  community.general.ufw:
    default: allow
    direction: outgoing

- name: allow traffic over tailscale
  community.general.ufw:
    rule: allow
    interface_in: tailscale0
  notify: reload ufw

- name: allow configured inbound ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    from_ip: "{{ item.from | default('any') }}"
  loop: "{{ firewall_allow_ports | default([]) }}"
  notify: reload ufw

# SSH stays reachable via tailscale0.
- name: delete bare 22/tcp allow rule
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    delete: true
  notify: reload ufw
