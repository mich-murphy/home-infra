apiVersion: v1
kind: Namespace
metadata:
  name: proof-network-test
  labels:
    app.kubernetes.io/part-of: talos-proof
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fixture
  namespace: proof-network-test
spec:
  storageClassName: proof-local
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture
  namespace: proof-network-test
spec:
  replicas: 0
  selector:
    matchLabels:
      app: fixture
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: talos-proof
        app: fixture
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
      - name: fixture
        image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
        command:
        - sh
        - -c
        - mkdir -p /data/www; httpd -f -p 8080 -h /data/www
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            memory: 32Mi
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: fixture
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: proof-validation
spec:
  replicas: 0
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: talos-proof
        app: client
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
      - name: fixture
        image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
        command:
        - sleep
        - '86400'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            memory: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: denied-client
  namespace: proof-network-test
spec:
  replicas: 0
  selector:
    matchLabels:
      app: denied-client
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: talos-proof
        app: denied-client
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
      - name: fixture
        image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
        command:
        - sleep
        - '86400'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fixture
  namespace: proof-network-test
spec:
  selector:
    app: fixture
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fixture
  namespace: proof-network-test
spec:
  hostnames:
  - fixture.proof.invalid
  parentRefs:
  - name: proof
    namespace: proof-gateway
  rules:
  - backendRefs:
    - name: fixture
      port: 8080
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: fixture-http
  namespace: proof-network-test
spec:
  endpointSelector:
    matchLabels:
      app: fixture
  ingress:
  - fromEntities:
    - ingress
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: proof-validation
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
