apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: talos-proof-boundaries
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.app.kubernetes.io/part-of: talos-proof
  enableDefaultDeny:
    ingress: true
    egress: true
  egressDeny:
  - toEntities:
    - world
    - host
    - remote-node
    - kube-apiserver
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: UDP
      - port: '53'
        protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: validation-to-proof
  namespace: proof-validation
spec:
  endpointSelector: {}
  egress:
  - toEndpoints:
    - matchLabels:
        io.cilium.k8s.namespace.labels.app.kubernetes.io/part-of: talos-proof
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: storage-controller-boundary
  namespace: local-path-storage
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: '6443'
        protocol: TCP
      - port: '443'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: UDP
      - port: '53'
        protocol: TCP
