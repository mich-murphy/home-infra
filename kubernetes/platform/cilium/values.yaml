# Cilium 1.20.4: Kubernetes 1.33–1.36; Gateway API 1.6.1.
# Dedicated proof node only, Talos KubePrism enabled, kube-proxy disabled.
ipam:
  mode: kubernetes
kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: 7445
routingMode: tunnel
tunnelProtocol: vxlan
bpf:
  hostLegacyRouting: true
  mapDynamicSizeRatio: 0.001
  preallocateMaps: false
  ctTcpMax: 65536
  ctAnyMax: 32768
  natMax: 65536
  policyMapMax: 4096
securityContext:
  capabilities:
    ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
operator:
  replicas: 1
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 192Mi}
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 512Mi}
envoy:
  enabled: true
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 192Mi}
gatewayAPI:
  enabled: true
  enableAlpn: true
l7Proxy: true
hubble:
  enabled: false
prometheus:
  enabled: false
l2announcements:
  enabled: false
# No address allocation or announcement on production LAN.
defaultLBServiceIPAM: none
socketLB:
  hostNamespaceOnly: true
