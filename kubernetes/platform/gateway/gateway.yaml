apiVersion: cilium.io/v2alpha1
kind: CiliumGatewayClassConfig
metadata:
  name: proof-nodeport
  namespace: proof-gateway
spec:
  service:
    type: NodePort
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: proof-cilium
spec:
  controllerName: io.cilium/gateway-controller
  parametersRef:
    group: cilium.io
    kind: CiliumGatewayClassConfig
    name: proof-nodeport
    namespace: proof-gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: proof
  namespace: proof-gateway
spec:
  gatewayClassName: proof-cilium
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    hostname: '*.proof.invalid'
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels: &id001
            app.kubernetes.io/part-of: talos-proof
  - name: https
    protocol: HTTPS
    port: 443
    hostname: '*.proof.invalid'
    tls:
      mode: Terminate
      certificateRefs:
      - name: proof-tls
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels: *id001
