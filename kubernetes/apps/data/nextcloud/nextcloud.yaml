apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-data
  labels:
    app.kubernetes.io/part-of: talos-proof
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: proof-local
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  labels: &id001
    app.kubernetes.io/part-of: talos-proof
    app.kubernetes.io/name: nextcloud
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nextcloud
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nextcloud
        image: nextcloud:35.0.2-apache@sha256:786c102155d2717ba0f53a62b3fdd7a1354edc48e800b94dbe32294d9a5752a2
        ports:
        - containerPort: 80
        env:
        - name: POSTGRES_HOST
          value: postgres
        - name: POSTGRES_USER
          value: nextcloud
        - name: POSTGRES_DB
          value: nextcloud
        - name: REDIS_HOST
          value: redis
        - name: NEXTCLOUD_ADMIN_USER
          value: proof
        - name: NEXTCLOUD_TRUSTED_DOMAINS
          value: nextcloud.proof.invalid nextcloud localhost 127.0.0.1
        - name: PHP_MEMORY_LIMIT
          value: 256M
        - name: PHP_OPCACHE_MEMORY_CONSUMPTION
          value: '64'
        - name: NEXTCLOUD_UPDATE
          value: '0'
        - name: OVERWRITEHOST
          value: nextcloud.proof.invalid
        - name: OVERWRITEPROTOCOL
          value: https
        - name: OVERWRITECLIURL
          value: https://nextcloud.proof.invalid
        envFrom:
        - secretRef:
            name: proof-credentials
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - SETUID
            - SETGID
            - DAC_OVERRIDE
            - FOWNER
            - KILL
        resources:
          requests:
            cpu: 25m
            memory: 320Mi
          limits:
            cpu: 1000m
            memory: 640Mi
        startupProbe:
          httpGet: &id002
            path: /status.php
            port: 80
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 90
        readinessProbe:
          httpGet: *id002
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet: *id002
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        volumeMounts:
        - name: data
          mountPath: /var/www/html
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: nextcloud-data
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  labels:
    app.kubernetes.io/part-of: talos-proof
    app.kubernetes.io/name: nextcloud
spec:
  selector:
    app.kubernetes.io/name: nextcloud
  ports:
  - name: http
    port: 80
    targetPort: 80
