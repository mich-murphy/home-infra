apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: nextcloud-gateway-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: nextcloud
  ingress:
  - fromEntities:
    - ingress
    toPorts:
    - ports:
      - port: '80'
        protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: collabora-gateway-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: collabora
  ingress:
  - fromEntities:
    - ingress
    toPorts:
    - ports:
      - port: '9980'
        protocol: TCP
