apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextcloud
spec:
  parentRefs:
  - name: proof
    namespace: proof-gateway
    sectionName: https
  hostnames:
  - nextcloud.proof.invalid
  rules:
  - backendRefs:
    - name: nextcloud
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: collabora
spec:
  parentRefs:
  - name: proof
    namespace: proof-gateway
    sectionName: https
  hostnames:
  - collabora.proof.invalid
  rules:
  - backendRefs:
    - name: collabora
      port: 9980
