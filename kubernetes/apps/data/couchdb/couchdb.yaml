apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: couchdb-data
  labels:
    app.kubernetes.io/part-of: talos-proof
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: proof-local
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: couchdb-config
data:
  proof.ini: '[couchdb]

    single_node=true

    [chttpd]

    require_valid_user=true

    '
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: couchdb
  labels: &id001
    app.kubernetes.io/part-of: talos-proof
    app.kubernetes.io/name: couchdb
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: couchdb
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 5984
      containers:
      - name: couchdb
        image: couchdb:3.5.3@sha256:907eab5b7e55ab7cfd241d39b90b2a335ea40bef82acee5a37388c08bf201dda
        ports:
        - containerPort: 5984
        env:
        - name: COUCHDB_USER
          value: proof
        envFrom:
        - secretRef:
            name: proof-credentials
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsUser: 5984
          runAsGroup: 5984
          runAsNonRoot: true
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 256Mi
        startupProbe:
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 90
          exec:
            command:
            - sh
            - -ec
            - curl --fail --silent --output /dev/null --user "$COUCHDB_USER:$COUCHDB_PASSWORD"
              http://127.0.0.1:5984/_up
        readinessProbe:
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
          exec:
            command:
            - sh
            - -ec
            - curl --fail --silent --output /dev/null --user "$COUCHDB_USER:$COUCHDB_PASSWORD"
              http://127.0.0.1:5984/_up
        livenessProbe:
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
          exec:
            command:
            - sh
            - -ec
            - curl --fail --silent --output /dev/null --user "$COUCHDB_USER:$COUCHDB_PASSWORD"
              http://127.0.0.1:5984/_up
        volumeMounts:
        - name: data
          mountPath: /opt/couchdb/data
        - name: config
          mountPath: /opt/couchdb/etc/local.d/proof.ini
          subPath: proof.ini
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: couchdb-data
      - name: config
        configMap:
          name: couchdb-config
---
apiVersion: v1
kind: Service
metadata:
  name: couchdb
  labels:
    app.kubernetes.io/part-of: talos-proof
    app.kubernetes.io/name: couchdb
spec:
  selector:
    app.kubernetes.io/name: couchdb
  ports:
  - name: http
    port: 5984
    targetPort: 5984
