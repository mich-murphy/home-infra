apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-data
  labels:
    app.kubernetes.io/part-of: talos-proof
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: proof-local
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich
  labels: &id001
    app.kubernetes.io/part-of: talos-proof
    app.kubernetes.io/name: immich
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immich
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: immich
        image: ghcr.io/immich-app/immich-server:v3.3.6@sha256:e1981983b1c13f6024b57d72e7ecae3342eed1581201ab09fb248932d86c593a
        ports:
        - containerPort: 2283
        env:
        - name: DB_HOSTNAME
          value: postgres
        - name: DB_USERNAME
          value: immich
        - name: DB_DATABASE_NAME
          value: immich
        - name: REDIS_HOSTNAME
          value: valkey
        - name: IMMICH_MACHINE_LEARNING_URL
          value: http://ml:3003
        - name: IMMICH_TELEMETRY_INCLUDE
          value: none
        - name: IMMICH_TELEMETRY_EXCLUDE
          value: all
        envFrom:
        - secretRef:
            name: proof-credentials
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 384Mi
          limits:
            cpu: 1000m
            memory: 768Mi
        startupProbe:
          httpGet: &id002
            path: /api/server/ping
            port: 2283
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 90
        readinessProbe:
          httpGet: *id002
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet: *id002
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: immich-data
---
apiVersion: v1
kind: Service
metadata:
  name: immich
  labels:
    app.kubernetes.io/part-of: talos-proof
    app.kubernetes.io/name: immich
spec:
  selector:
    app.kubernetes.io/name: immich
  ports:
  - name: http
    port: 2283
    targetPort: 2283
