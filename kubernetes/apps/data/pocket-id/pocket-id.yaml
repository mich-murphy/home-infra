apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pocket-id-data
  labels:
    app.kubernetes.io/part-of: talos-proof
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: proof-local
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocket-id
  labels: &id001
    app.kubernetes.io/part-of: talos-proof
    app.kubernetes.io/name: pocket-id
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pocket-id
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: pocket-id
        image: ghcr.io/pocket-id/pocket-id:v2.19.2@sha256:3ee23895d6a3adb5dd5de801a4fd31fc31b960e6dfbea9b5200e33cf477695eb
        ports:
        - containerPort: 1411
        env:
        - name: APP_URL
          value: https://pocket-id.proof.invalid
        - name: TRUST_PROXY
          value: 'true'
        - name: ANALYTICS_DISABLED
          value: 'true'
        - name: PUID
          value: '1000'
        - name: PGID
          value: '1000'
        envFrom:
        - secretRef:
            name: proof-credentials
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - SETUID
            - SETGID
            - DAC_OVERRIDE
            - FOWNER
            - KILL
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 1000m
            memory: 192Mi
        startupProbe:
          httpGet: &id002
            path: /healthz
            port: 1411
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 90
        readinessProbe:
          httpGet: *id002
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet: *id002
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pocket-id-data
---
apiVersion: v1
kind: Service
metadata:
  name: pocket-id
  labels:
    app.kubernetes.io/part-of: talos-proof
    app.kubernetes.io/name: pocket-id
spec:
  selector:
    app.kubernetes.io/name: pocket-id
  ports:
  - name: http
    port: 1411
    targetPort: 1411
