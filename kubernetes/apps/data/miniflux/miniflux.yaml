apiVersion: apps/v1
kind: Deployment
metadata:
  name: miniflux
  labels: &id001
    app.kubernetes.io/part-of: talos-proof
    app.kubernetes.io/name: miniflux
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: miniflux
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: wait-proof-postgres
        image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        command:
        - sh
        - -ec
        - 'i=0; until pg_isready -h postgres -U miniflux -d miniflux -t 2; do i=$((i+1)); test "$i" -lt 90 || exit 1; sleep 2; done'
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 1000m
            memory: 128Mi
      containers:
      - name: miniflux
        image: miniflux/miniflux:2.3.5@sha256:8fd6c3c434ecc3d4083306f83e03c0bb74c632e0f8378da5ead7e1773b0b89c9
        ports:
        - containerPort: 8080
        env:
        - name: CREATE_ADMIN
          value: '1'
        - name: ADMIN_USERNAME
          value: proof
        - name: RUN_MIGRATIONS
          value: '1'
        - name: BASE_URL
          value: https://miniflux.proof.invalid
        - name: POLLING_FREQUENCY
          value: '1440'
        - name: SCHEDULER_ENTRY_FREQUENCY_FACTOR
          value: '1'
        - name: FETCHER_ALLOW_PRIVATE_NETWORKS
          value: '1'
        envFrom:
        - secretRef:
            name: proof-credentials
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 1000m
            memory: 128Mi
        startupProbe:
          httpGet: &id002
            path: /healthcheck
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 90
        readinessProbe:
          httpGet: *id002
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet: *id002
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: miniflux
  labels:
    app.kubernetes.io/part-of: talos-proof
    app.kubernetes.io/name: miniflux
spec:
  selector:
    app.kubernetes.io/name: miniflux
  ports:
  - name: http
    port: 8080
    targetPort: 8080
