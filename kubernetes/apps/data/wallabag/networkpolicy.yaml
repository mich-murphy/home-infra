apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wallabag-proof-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wallabag
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: proof-validation
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: proof-gateway
    ports:
    - protocol: TCP
      port: 80
