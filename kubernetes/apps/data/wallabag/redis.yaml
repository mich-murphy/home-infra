apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: &id001
    app.kubernetes.io/part-of: talos-proof
    app.kubernetes.io/name: redis
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: redis
        image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
        ports:
        - containerPort: 6379
        env: []
        envFrom:
        - secretRef:
            name: proof-credentials
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - SETUID
            - SETGID
            - DAC_OVERRIDE
            - FOWNER
            - KILL
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 1000m
            memory: 64Mi
        startupProbe:
          tcpSocket: &id002
            port: 6379
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 90
        readinessProbe:
          tcpSocket: *id002
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          tcpSocket: *id002
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/part-of: talos-proof
    app.kubernetes.io/name: redis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
  - name: tcp
    port: 6379
    targetPort: 6379
