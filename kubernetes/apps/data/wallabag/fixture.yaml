apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: fixture
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fixture
        app.kubernetes.io/part-of: talos-proof
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 33
        runAsGroup: 33
        runAsNonRoot: true
      containers:
      - name: fixture
        image: nextcloud:35.0.2-apache@sha256:786c102155d2717ba0f53a62b3fdd7a1354edc48e800b94dbe32294d9a5752a2
        command:
        - php
        - -S
        - 0.0.0.0:8080
        - -t
        - /fixture
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /feed.xml
            port: 8080
        livenessProbe:
          httpGet:
            path: /article.html
            port: 8080
        volumeMounts:
        - name: fixture
          mountPath: /fixture
          readOnly: true
      volumes:
      - name: fixture
        configMap:
          name: fixture
---
apiVersion: v1
kind: Service
metadata:
  name: fixture
spec:
  selector:
    app.kubernetes.io/name: fixture
  ports:
  - port: 8080
    targetPort: 8080
