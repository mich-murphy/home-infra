apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wallabag-data
  labels:
    app.kubernetes.io/part-of: talos-proof
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: proof-local
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallabag
  labels: &id001
    app.kubernetes.io/part-of: talos-proof
    app.kubernetes.io/name: wallabag
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wallabag
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: wallabag
        image: wallabag/wallabag:2.6.15.1@sha256:2e9d9fbbba6feee060109351d1235386fa4ac495f98c82d94a250d56feaeaeeb
        ports:
        - containerPort: 80
        env:
        - name: SYMFONY__ENV__DATABASE_DRIVER
          value: pdo_mysql
        - name: SYMFONY__ENV__DATABASE_HOST
          value: mariadb
        - name: SYMFONY__ENV__DATABASE_PORT
          value: '3306'
        - name: SYMFONY__ENV__DATABASE_NAME
          value: wallabag
        - name: SYMFONY__ENV__DATABASE_USER
          value: wallabag
        - name: SYMFONY__ENV__DATABASE_CHARSET
          value: utf8mb4
        - name: SYMFONY__ENV__DOMAIN_NAME
          value: https://wallabag.proof.invalid
        - name: SYMFONY__ENV__SERVER_NAME
          value: Proof Wallabag
        - name: SYMFONY__ENV__REDIS_HOST
          value: redis
        - name: SYMFONY__ENV__REDIS_SCHEME
          value: tcp
        - name: SYMFONY__ENV__REDIS_PORT
          value: '6379'
        - name: SYMFONY__ENV__MAILER_HOST
          value: 127.0.0.1
        envFrom:
        - secretRef:
            name: proof-credentials
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - SETUID
            - SETGID
            - DAC_OVERRIDE
            - FOWNER
            - KILL
            - NET_BIND_SERVICE
        resources:
          requests:
            cpu: 25m
            memory: 192Mi
          limits:
            cpu: 1000m
            memory: 384Mi
        startupProbe:
          httpGet: &id002
            path: /api/info
            port: 80
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 90
        readinessProbe:
          httpGet: *id002
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet: *id002
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        volumeMounts:
        - name: data
          mountPath: /var/www/wallabag/web/assets/images
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: wallabag-data
---
apiVersion: v1
kind: Service
metadata:
  name: wallabag
  labels:
    app.kubernetes.io/part-of: talos-proof
    app.kubernetes.io/name: wallabag
spec:
  selector:
    app.kubernetes.io/name: wallabag
  ports:
  - name: http
    port: 80
    targetPort: 80
