# Explicit proof-only shared pipeline trust group. Default stopped.
apiVersion: v1
kind: Namespace
metadata:
  name: proof-media-pipeline
  labels:
    app.kubernetes.io/part-of: talos-proof
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: proof-media-pipeline
  labels:
    app.kubernetes.io/part-of: talos-proof
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: proof-local
  resources:
    requests:
      storage: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: proof-media-pipeline
  labels:
    app.kubernetes.io/part-of: talos-proof
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
