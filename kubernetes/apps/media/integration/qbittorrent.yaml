      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: proof-media-pipeline
  labels: &id001
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/part-of: talos-proof
spec:
  selector: *id001
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: proof-media-pipeline
  labels: &id001
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/part-of: talos-proof
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: qbittorrent
        image: lscr.io/linuxserver/qbittorrent:5.3.0_v2.1.2-ls485@sha256:75ecbb1c89ab7b0a21c4bde40b4820e4f1649d2d56d83b91913422155e8d2a5f
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: Etc/UTC
        - name: PUID
          value: '1000'
        - name: PGID
          value: '1000'
        - name: WEBUI_PORT
          value: '8080'
        - name: TORRENTING_PORT
          value: '25565'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - SETUID
            - SETGID
            - DAC_OVERRIDE
            - FOWNER
            - KILL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 192Mi
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: false
        - name: fixture
          mountPath: /data
          readOnly: false
        ports:
        - name: http
          containerPort: 8080
        startupProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 5
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: qbittorrent-config
      - name: fixture
        persistentVolumeClaim:
          claimName: data
      - name: seed
        secret:
          secretName: qbittorrent-bootstrap
          items:
          - key: seed
            path: seed
      - name: shared-data
        persistentVolumeClaim:
          claimName: data
      terminationGracePeriodSeconds: 30
      initContainers:
      - name: prepare-shared-data
        image: lscr.io/linuxserver/qbittorrent:5.3.0_v2.1.2-ls485@sha256:75ecbb1c89ab7b0a21c4bde40b4820e4f1649d2d56d83b91913422155e8d2a5f
        command:
        - /bin/sh
        - -ec
        - mkdir -p /data/torrents /data/usenet/incomplete /data/usenet/complete /data/media/movies
          /data/media/tv /data/music
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: shared-data
          mountPath: /data
      - name: seed-fresh-config
        image: lscr.io/linuxserver/qbittorrent:5.3.0_v2.1.2-ls485@sha256:75ecbb1c89ab7b0a21c4bde40b4820e4f1649d2d56d83b91913422155e8d2a5f
        command:
        - /bin/sh
        - -ec
        - mkdir -p /config/qBittorrent; if [ ! -e /config/qBittorrent/qBittorrent.conf
          ]; then cp /seed/seed /config/qBittorrent/qBittorrent.conf; chmod 600 /config/qBittorrent/qBittorrent.conf;
          chown 1000:1000 /config/qBittorrent/qBittorrent.conf; fi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
          runAsUser: 0
          runAsGroup: 0
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: config
          mountPath: /config
        - name: seed
          mountPath: /seed
          readOnly: true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qbittorrent-from-proof-gateway
  namespace: proof-media-pipeline
  labels:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/part-of: talos-proof
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: proof-gateway
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qbittorrent
  namespace: proof-media-pipeline
  labels:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/part-of: talos-proof
spec:
  parentRefs:
  - name: proof
    namespace: proof-gateway
  hostnames:
  - pipeline-qbittorrent.proof.invalid
  rules:
  - filters:
    - type: URLRewrite
      urlRewrite:
        hostname: pipeline-qbittorrent.proof.invalid
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set:
        - name: X-Forwarded-Host
          value: pipeline-qbittorrent.proof.invalid:18443
    backendRefs:
    - name: qbittorrent
      port: 8080
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: qbittorrent-from-proof-cilium-ingress
  namespace: proof-media-pipeline
  labels:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/part-of: talos-proof
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  ingress:
  - fromEntities:
    - ingress
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
