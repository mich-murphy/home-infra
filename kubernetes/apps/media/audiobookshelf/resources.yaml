# Fresh isolated proof only. See docs/talos-proof-media.md.
apiVersion: v1
kind: Namespace
metadata:
  name: proof-audiobookshelf
  labels:
    app.kubernetes.io/name: audiobookshelf
    app.kubernetes.io/part-of: talos-proof
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: proof-audiobookshelf
  labels:
    app.kubernetes.io/name: audiobookshelf
    app.kubernetes.io/part-of: talos-proof
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dns-and-validation
  namespace: proof-audiobookshelf
  labels:
    app.kubernetes.io/name: audiobookshelf
    app.kubernetes.io/part-of: talos-proof
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: proof-validation
    ports:
    - port: 80
      protocol: TCP
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config
  namespace: proof-audiobookshelf
  labels:
    app.kubernetes.io/name: audiobookshelf
    app.kubernetes.io/part-of: talos-proof
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: proof-local
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fixture
  namespace: proof-audiobookshelf
  labels:
    app.kubernetes.io/name: audiobookshelf
    app.kubernetes.io/part-of: talos-proof
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: proof-local
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: metadata
  namespace: proof-audiobookshelf
  labels:
    app.kubernetes.io/name: audiobookshelf
    app.kubernetes.io/part-of: talos-proof
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: proof-local
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: audiobookshelf
  namespace: proof-audiobookshelf
  labels: &id001
    app.kubernetes.io/name: audiobookshelf
    app.kubernetes.io/part-of: talos-proof
spec:
  selector: *id001
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
  namespace: proof-audiobookshelf
  labels: &id001
    app.kubernetes.io/name: audiobookshelf
    app.kubernetes.io/part-of: talos-proof
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: audiobookshelf
        image: ghcr.io/advplyr/audiobookshelf:2.37.2@sha256:b897c33f05972fb1bf484f7487bc878fa91ec8691335c1db6e2929c3a7658efa
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: Etc/UTC
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: false
        - name: fixture
          mountPath: /data/audiobooks
          readOnly: true
        - name: metadata
          mountPath: /metadata
          readOnly: false
        ports:
        - name: http
          containerPort: 80
        startupProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 5
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: config
      - name: fixture
        persistentVolumeClaim:
          claimName: fixture
      - name: metadata
        persistentVolumeClaim:
          claimName: metadata
      terminationGracePeriodSeconds: 30
