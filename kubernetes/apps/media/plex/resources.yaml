# Fresh synthetic-fixture experiment; memory ceilings unproven until live evidence.
apiVersion: v1
kind: Namespace
metadata:
  name: proof-plex
  labels:
    app.kubernetes.io/name: plex
    app.kubernetes.io/part-of: talos-proof
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: proof-plex
  labels:
    app.kubernetes.io/name: plex
    app.kubernetes.io/part-of: talos-proof
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dns-and-validation
  namespace: proof-plex
  labels:
    app.kubernetes.io/name: plex
    app.kubernetes.io/part-of: talos-proof
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: proof-validation
    ports:
    - port: 32401
      protocol: TCP
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-tautulli
  namespace: proof-plex
  labels:
    app.kubernetes.io/name: plex
    app.kubernetes.io/part-of: talos-proof
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: proof-tautulli
      podSelector:
        matchLabels:
          app.kubernetes.io/name: tautulli
    ports:
    - protocol: TCP
      port: 32401
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-kometa
  namespace: proof-plex
  labels:
    app.kubernetes.io/name: plex
    app.kubernetes.io/part-of: talos-proof
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: proof-kometa
      podSelector:
        matchLabels:
          app.kubernetes.io/name: kometa
    ports:
    - protocol: TCP
      port: 32401
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-jellyplex-watched
  namespace: proof-plex
  labels:
    app.kubernetes.io/name: plex
    app.kubernetes.io/part-of: talos-proof
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: proof-jellyplex-watched
      podSelector:
        matchLabels:
          app.kubernetes.io/name: jellyplex-watched
    ports:
    - protocol: TCP
      port: 32401
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config
  namespace: proof-plex
  labels:
    app.kubernetes.io/name: plex
    app.kubernetes.io/part-of: talos-proof
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: proof-local
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fixture
  namespace: proof-plex
  labels:
    app.kubernetes.io/name: plex
    app.kubernetes.io/part-of: talos-proof
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: proof-local
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: plex
  namespace: proof-plex
  labels: &id001
    app.kubernetes.io/name: plex
    app.kubernetes.io/part-of: talos-proof
spec:
  selector: *id001
  ports:
  - name: http
    port: 32401
    targetPort: proof-http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
  namespace: proof-plex
  labels: &id001
    app.kubernetes.io/name: plex
    app.kubernetes.io/part-of: talos-proof
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: plex
        image: plexinc/pms-docker:1.43.5.11079-b3b13e506@sha256:6d778d41daae68f89115aa87a44ae14a96b23e71a2093da173b5a9aac4091336
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: Etc/UTC
        - name: PLEX_UID
          value: '1000'
        - name: PLEX_GID
          value: '1000'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - SETUID
            - SETGID
            - DAC_OVERRIDE
            - FOWNER
            - KILL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 384Mi
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: false
        - name: fixture
          mountPath: /data/media
          readOnly: true
        - name: scratch
          mountPath: /transcode
          readOnly: false
        ports:
        - name: http
          containerPort: 32400
        startupProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /identity
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 5
      - name: local-unclaimed-adapter
        image: ghcr.io/linuxserver/tautulli:v2.18.2-ls251@sha256:7ca2e262712700ae28ca5b32f9cebf1168e3ea3bfcd97a8da6e040f5ca6227a5
        command:
        - python3
        - /proof/plex-unclaimed-proxy.py
        - --key-file
        - /proof-auth/key
        - --password-file
        - /proof-auth/password
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        ports:
        - name: proof-http
          containerPort: 32401
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 200m
            memory: 64Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: local-adapter-code
          mountPath: /proof
          readOnly: true
        - name: local-adapter-auth
          mountPath: /proof-auth
          readOnly: true
        startupProbe:
          tcpSocket:
            port: proof-http
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /proof-health
            port: proof-http
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: proof-http
          periodSeconds: 30
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: config
      - name: fixture
        persistentVolumeClaim:
          claimName: fixture
      - name: scratch
        emptyDir:
          sizeLimit: 256Mi
      - name: local-adapter-code
        configMap:
          name: local-unclaimed-adapter
      - name: local-adapter-auth
        secret:
          secretName: bootstrap
          items:
          - key: api-key
            path: key
          - key: password
            path: password
      terminationGracePeriodSeconds: 30
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-proof-gateway
  namespace: proof-plex
  labels:
    app.kubernetes.io/name: plex
    app.kubernetes.io/part-of: talos-proof
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: plex
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: proof-gateway
    ports:
    - protocol: TCP
      port: 32401
