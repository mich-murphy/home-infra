apiVersion: v1
kind: Namespace
metadata:
  name: proof-radarr
  labels:
    app.kubernetes.io/name: radarr
    app.kubernetes.io/part-of: talos-proof
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: proof-radarr
  labels:
    app.kubernetes.io/name: radarr
    app.kubernetes.io/part-of: talos-proof
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dns-and-validation
  namespace: proof-radarr
  labels:
    app.kubernetes.io/name: radarr
    app.kubernetes.io/part-of: talos-proof
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: proof-validation
    ports:
    - port: 7878
      protocol: TCP
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
