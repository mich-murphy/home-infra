apiVersion: v1
kind: Namespace
metadata:
  name: proof-seerr
  labels:
    app.kubernetes.io/name: seerr
    app.kubernetes.io/part-of: talos-proof
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: proof-seerr
  labels:
    app.kubernetes.io/name: seerr
    app.kubernetes.io/part-of: talos-proof
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dns-and-validation
  namespace: proof-seerr
  labels:
    app.kubernetes.io/name: seerr
    app.kubernetes.io/part-of: talos-proof
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: proof-validation
    ports:
    - port: 5055
      protocol: TCP
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: to-radarr
  namespace: proof-seerr
  labels:
    app.kubernetes.io/name: seerr
    app.kubernetes.io/part-of: talos-proof
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: proof-radarr
      podSelector:
        matchLabels:
          app.kubernetes.io/name: radarr
    ports:
    - protocol: TCP
      port: 7878
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: to-sonarr
  namespace: proof-seerr
  labels:
    app.kubernetes.io/name: seerr
    app.kubernetes.io/part-of: talos-proof
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: proof-sonarr
      podSelector:
        matchLabels:
          app.kubernetes.io/name: sonarr
    ports:
    - protocol: TCP
      port: 8989
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: to-jellyfin
  namespace: proof-seerr
  labels:
    app.kubernetes.io/name: seerr
    app.kubernetes.io/part-of: talos-proof
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: proof-jellyfin
      podSelector:
        matchLabels:
          app.kubernetes.io/name: jellyfin
    ports:
    - protocol: TCP
      port: 8096
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config
  namespace: proof-seerr
  labels:
    app.kubernetes.io/name: seerr
    app.kubernetes.io/part-of: talos-proof
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: proof-local
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: seerr
  namespace: proof-seerr
  labels: &id001
    app.kubernetes.io/name: seerr
    app.kubernetes.io/part-of: talos-proof
spec:
  selector: *id001
  ports:
  - name: http
    port: 5055
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  namespace: proof-seerr
  labels: &id001
    app.kubernetes.io/name: seerr
    app.kubernetes.io/part-of: talos-proof
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: seerr
        image: ghcr.io/seerr-team/seerr:v3.5.1@sha256:d8fab675b55ad293ded98fd71efcfd46054cbad9746534ae1cc4794a88c0b3be
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: Etc/UTC
        - name: NODE_EXTRA_CA_CERTS
          value: /proof-contract-tls/ca.crt
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 384Mi
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: false
        - name: metadata-contract-tls
          mountPath: /proof-contract-tls
          readOnly: true
        ports:
        - name: http
          containerPort: 5055
        startupProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /api/v1/status
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 5
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: config
      - configMap:
          name: metadata-contract-code
        name: metadata-contract-code
      - name: metadata-contract-key
        secret:
          items:
          - key: api-key
            path: api-key
          secretName: bootstrap
      - name: metadata-contract-tls
        secret:
          defaultMode: 292
          secretName: metadata-contract-tls
      terminationGracePeriodSeconds: 30
      initContainers:
      - args:
        - --fixtures
        - /proof-contract/tmdb-contract.json
        - --key-file
        - /proof-contract-key/api-key
        - --certificate
        - /proof-contract-tls/tls.crt
        - --private-key
        - /proof-contract-tls/tls.key
        - --client
        - seerr
        command:
        - python3
        - -B
        - /proof-contract/metadata-proxy.py
        image: ghcr.io/linuxserver/tautulli:v2.18.2-ls251@sha256:7ca2e262712700ae28ca5b32f9cebf1168e3ea3bfcd97a8da6e040f5ca6227a5
        name: metadata-contract
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 24Mi
        restartPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        startupProbe:
          exec:
            command:
            - python3
            - -c
            - import urllib.request; urllib.request.urlopen("http://127.0.0.1:18081/proof-contract-evidence",timeout=2).read()
          failureThreshold: 15
          periodSeconds: 2
        volumeMounts:
        - mountPath: /proof-contract
          name: metadata-contract-code
          readOnly: true
        - mountPath: /proof-contract-key
          name: metadata-contract-key
          readOnly: true
        - mountPath: /proof-contract-tls
          name: metadata-contract-tls
          readOnly: true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-proof-gateway
  namespace: proof-seerr
  labels:
    app.kubernetes.io/name: seerr
    app.kubernetes.io/part-of: talos-proof
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: seerr
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: proof-gateway
    ports:
    - protocol: TCP
      port: 5055
