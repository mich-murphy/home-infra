apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config
  namespace: proof-prowlarr
  labels:
    app.kubernetes.io/name: prowlarr
    app.kubernetes.io/part-of: talos-proof
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: proof-local
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: proof-prowlarr
  labels: &id001
    app.kubernetes.io/name: prowlarr
    app.kubernetes.io/part-of: talos-proof
spec:
  selector: *id001
  ports:
  - name: http
    port: 9696
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: proof-prowlarr
  labels: &id001
    app.kubernetes.io/name: prowlarr
    app.kubernetes.io/part-of: talos-proof
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: prowlarr
        image: ghcr.io/linuxserver/prowlarr:2.6.5.5623-ls165@sha256:b3b00047ed20f6ce2b16780145cb6a0acb51c9e28ea6aa6f5dcd33c7034f1797
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: Etc/UTC
        - name: PUID
          value: '1000'
        - name: PGID
          value: '1000'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - SETUID
            - SETGID
            - DAC_OVERRIDE
            - FOWNER
            - KILL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 256Mi
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: false
        ports:
        - name: http
          containerPort: 9696
        startupProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /ping
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 5
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: config
      - name: seed
        secret:
          secretName: bootstrap
          items:
          - key: seed
            path: seed
      terminationGracePeriodSeconds: 30
      initContainers:
      - name: seed-fresh-config
        image: ghcr.io/linuxserver/prowlarr:2.6.5.5623-ls165@sha256:b3b00047ed20f6ce2b16780145cb6a0acb51c9e28ea6aa6f5dcd33c7034f1797
        command:
        - /bin/sh
        - -ec
        - mkdir -p /config/.; if [ ! -e /config/config.xml ]; then cp /seed/seed /config/config.xml;
          chmod 600 /config/config.xml; chown 1000:1000 /config/config.xml; fi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
          runAsUser: 0
          runAsGroup: 0
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: config
          mountPath: /config
        - name: seed
          mountPath: /seed
          readOnly: true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-proof-gateway
  namespace: proof-prowlarr
  labels:
    app.kubernetes.io/name: prowlarr
    app.kubernetes.io/part-of: talos-proof
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: proof-gateway
    ports:
    - protocol: TCP
      port: 9696
