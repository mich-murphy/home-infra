apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: from-proof-cilium-ingress
  namespace: proof-pinchflat
  labels:
    app.kubernetes.io/name: pinchflat
    app.kubernetes.io/part-of: talos-proof
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: pinchflat
  ingress:
  - fromEntities:
    - ingress
    toPorts:
    - ports:
      - port: '8945'
        protocol: TCP
