apiVersion: v1
kind: Namespace
metadata:
  name: proof-tautulli
  labels:
    app.kubernetes.io/name: tautulli
    app.kubernetes.io/part-of: talos-proof
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: proof-tautulli
  labels:
    app.kubernetes.io/name: tautulli
    app.kubernetes.io/part-of: talos-proof
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dns-and-validation
  namespace: proof-tautulli
  labels:
    app.kubernetes.io/name: tautulli
    app.kubernetes.io/part-of: talos-proof
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: proof-validation
    ports:
    - port: 8181
      protocol: TCP
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: to-plex
  namespace: proof-tautulli
  labels:
    app.kubernetes.io/name: tautulli
    app.kubernetes.io/part-of: talos-proof
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: proof-plex
      podSelector:
        matchLabels:
          app.kubernetes.io/name: plex
    ports:
    - protocol: TCP
      port: 33240
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config
  namespace: proof-tautulli
  labels:
    app.kubernetes.io/name: tautulli
    app.kubernetes.io/part-of: talos-proof
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: proof-local
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tautulli
  namespace: proof-tautulli
  labels: &id001
    app.kubernetes.io/name: tautulli
    app.kubernetes.io/part-of: talos-proof
spec:
  selector: *id001
  ports:
  - name: http
    port: 8181
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tautulli
  namespace: proof-tautulli
  labels: &id001
    app.kubernetes.io/name: tautulli
    app.kubernetes.io/part-of: talos-proof
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: tautulli
        image: ghcr.io/linuxserver/tautulli:v2.18.2-ls251@sha256:7ca2e262712700ae28ca5b32f9cebf1168e3ea3bfcd97a8da6e040f5ca6227a5
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: Etc/UTC
        - name: PUID
          value: '1000'
        - name: PGID
          value: '1000'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - SETUID
            - SETGID
            - DAC_OVERRIDE
            - FOWNER
            - KILL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 256Mi
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: false
        ports:
        - name: http
          containerPort: 8181
        startupProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /status
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 5
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: config
      - name: seed
        secret:
          secretName: bootstrap
          items:
          - key: seed
            path: seed
      terminationGracePeriodSeconds: 30
      initContainers:
      - name: seed-fresh-config
        image: ghcr.io/linuxserver/tautulli:v2.18.2-ls251@sha256:7ca2e262712700ae28ca5b32f9cebf1168e3ea3bfcd97a8da6e040f5ca6227a5
        command:
        - /bin/sh
        - -ec
        - if [ ! -e /config/config.ini ]; then cp /seed/seed /config/config.ini; chmod
          600 /config/config.ini; chown 1000:1000 /config/config.ini; fi
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: config
          mountPath: /config
        - name: seed
          mountPath: /seed
          readOnly: true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-proof-gateway
  namespace: proof-tautulli
  labels:
    app.kubernetes.io/name: tautulli
    app.kubernetes.io/part-of: talos-proof
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tautulli
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: proof-gateway
    ports:
    - protocol: TCP
      port: 8181
