# Fresh isolated proof only. See docs/talos-proof-media.md.
apiVersion: v1
kind: Namespace
metadata:
  name: proof-recyclarr
  labels:
    app.kubernetes.io/name: recyclarr
    app.kubernetes.io/part-of: talos-proof
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: proof-recyclarr
  labels:
    app.kubernetes.io/name: recyclarr
    app.kubernetes.io/part-of: talos-proof
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dns-and-validation
  namespace: proof-recyclarr
  labels:
    app.kubernetes.io/name: recyclarr
    app.kubernetes.io/part-of: talos-proof
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: to-radarr
  namespace: proof-recyclarr
  labels:
    app.kubernetes.io/name: recyclarr
    app.kubernetes.io/part-of: talos-proof
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: proof-radarr
      podSelector:
        matchLabels:
          app.kubernetes.io/name: radarr
    ports:
    - protocol: TCP
      port: 7878
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: to-sonarr
  namespace: proof-recyclarr
  labels:
    app.kubernetes.io/name: recyclarr
    app.kubernetes.io/part-of: talos-proof
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: proof-sonarr
      podSelector:
        matchLabels:
          app.kubernetes.io/name: sonarr
    ports:
    - protocol: TCP
      port: 8989
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config
  namespace: proof-recyclarr
  labels:
    app.kubernetes.io/name: recyclarr
    app.kubernetes.io/part-of: talos-proof
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: proof-local
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recyclarr
  namespace: proof-recyclarr
  labels: &id001
    app.kubernetes.io/name: recyclarr
    app.kubernetes.io/part-of: talos-proof
spec:
  schedule: 0 4 * * *
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 180
      template:
        metadata:
          labels: *id001
        spec:
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          containers:
          - name: recyclarr
            image: ghcr.io/recyclarr/recyclarr:8.7.3@sha256:9c6c74d52cfc6f740a5a3624aa83867e171bb70b90453ddb7a4048b8c80445f9
            imagePullPolicy: IfNotPresent
            env:
            - name: TZ
              value: Etc/UTC
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              readOnlyRootFilesystem: true
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 1000m
                memory: 512Mi
            volumeMounts:
            - name: config
              mountPath: /config
              readOnly: false
            - name: tmp
              mountPath: /tmp
            args:
            - sync
            - --preview
          volumes:
          - name: config
            persistentVolumeClaim:
              claimName: config
          - name: seed
            secret:
              secretName: bootstrap
              items:
              - key: seed
                path: seed
          - name: tmp
            emptyDir:
              sizeLimit: 64Mi
          terminationGracePeriodSeconds: 30
          initContainers:
          - name: seed-fresh-config
            image: ghcr.io/recyclarr/recyclarr:8.7.3@sha256:9c6c74d52cfc6f740a5a3624aa83867e171bb70b90453ddb7a4048b8c80445f9
            command:
            - /bin/sh
            - -ec
            - mkdir -p /config/.; if [ ! -e /config/recyclarr.yml ]; then cp /seed/seed
              /config/recyclarr.yml; chmod 600 /config/recyclarr.yml; chown 1000:1000
              /config/recyclarr.yml; fi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
                add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
              runAsUser: 0
              runAsGroup: 0
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 200m
                memory: 128Mi
            volumeMounts:
            - name: config
              mountPath: /config
            - name: seed
              mountPath: /seed
              readOnly: true
          restartPolicy: Never
