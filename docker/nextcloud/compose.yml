---
x-nextcloud-environment: &nextcloud-environment
  POSTGRES_DB: nextcloud
  POSTGRES_USER: nextcloud
  POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
  POSTGRES_HOST: nextcloud-postgres
  REDIS_HOST: nextcloud-redis
  REDIS_HOST_PASSWORD: ${NEXTCLOUD_REDIS_PASSWORD}
  NEXTCLOUD_ADMIN_USER: ${ADMIN_USERNAME}
  NEXTCLOUD_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  NEXTCLOUD_TRUSTED_DOMAINS: nextcloud.local.elmurphy.com owncloud.local.elmurphy.com nextcloud
  APACHE_DISABLE_REWRITE_IP: "1"
  TRUSTED_PROXIES: 172.20.1.0/24
  OVERWRITEHOST: nextcloud.local.elmurphy.com
  OVERWRITEPROTOCOL: https
  OVERWRITECLIURL: https://nextcloud.local.elmurphy.com
  NEXTCLOUD_INIT_HTACCESS: "true"
  PHP_MEMORY_LIMIT: 1G
  PHP_OPCACHE_MEMORY_CONSUMPTION: "256"
  PHP_UPLOAD_LIMIT: 10G
  APACHE_BODY_LIMIT: "10737418240"

x-nextcloud-capabilities: &nextcloud-capabilities
  - CHOWN
  - SETUID
  - SETGID
  - DAC_OVERRIDE
  - FOWNER
  - KILL

services:
  nextcloud:
    image: nextcloud:35.0.2-apache@sha256:89af7ee7a96ff5e9668280566209268ae6b2d02327f6ef6d56f6d68228cf9431
    container_name: nextcloud
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: *nextcloud-capabilities
    networks:
      - proxy
      - nextcloud-backend
    environment: *nextcloud-environment
    volumes:
      - nextcloud-html:/var/www/html
      - type: bind
        source: /mnt/nextcloud/nextcloud-data
        target: /var/www/html/data
        bind:
          propagation: rslave
    configs:
      # Inline so Portainer can deploy it without relative-path volumes; the
      # nextcloud image only runs post-installation hooks that are executable.
      - source: nextcloud-post-installation
        target: /docker-entrypoint-hooks.d/post-installation/10-configure.sh
        mode: 0555
    labels:
      - traefik.enable=true
      - traefik.http.routers.nextcloud.rule=Host(`nextcloud.local.elmurphy.com`) || Host(`owncloud.local.elmurphy.com`)
      - traefik.http.routers.nextcloud.tls=true
      - traefik.http.routers.nextcloud.middlewares=kds-media-only@file,nextcloud-dav,default-headers@file
      - traefik.http.middlewares.nextcloud-dav.redirectregex.regex=^https://([^/]+)/.well-known/(?:card|cal)dav$$
      - traefik.http.middlewares.nextcloud-dav.redirectregex.replacement=https://$${1}/remote.php/dav
      - traefik.http.middlewares.nextcloud-dav.redirectregex.permanent=true
      - traefik.http.services.nextcloud.loadbalancer.server.port=80
    depends_on:
      nextcloud-postgres:
        condition: service_healthy
      nextcloud-redis:
        condition: service_healthy
      nextcloud-office:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/status.php"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 2m
    restart: unless-stopped

  nextcloud-cron:
    image: nextcloud:35.0.2-apache@sha256:89af7ee7a96ff5e9668280566209268ae6b2d02327f6ef6d56f6d68228cf9431
    container_name: nextcloud-cron
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: *nextcloud-capabilities
    networks:
      - nextcloud-backend
      - nextcloud-egress
    environment: *nextcloud-environment
    volumes:
      - nextcloud-html:/var/www/html
      - type: bind
        source: /mnt/nextcloud/nextcloud-data
        target: /var/www/html/data
        bind:
          propagation: rslave
    entrypoint: /cron.sh
    depends_on:
      nextcloud:
        condition: service_healthy
    restart: unless-stopped

  nextcloud-postgres:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    container_name: nextcloud-postgres
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
      - KILL
    networks:
      - nextcloud-backend
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      # postgres 18+ images require the mount at /var/lib/postgresql, with data in a
      # major-version subdirectory.
      - nextcloud-db:/var/lib/postgresql
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  nextcloud-redis:
    image: redis:8.10.2@sha256:97ec88159e6d7cfb5ddef9015386087d58a912de80112f06ebdfa78fa5989901
    container_name: nextcloud-redis
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETPCAP
    networks:
      - nextcloud-backend
    environment:
      REDIS_PASSWORD: ${NEXTCLOUD_REDIS_PASSWORD}
    volumes:
      - nextcloud-cache:/data
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${NEXTCLOUD_REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nextcloud-office:
    image: collabora/code:26.04.5.2.1@sha256:c7415b963e32eb0986a562583f154d36d3d7a461e1ddfb660a95e87094328acb
    container_name: nextcloud-office
    # coolforkit relies on setuid/file capabilities; no-new-privileges breaks it.
    cap_drop:
      - ALL
    cap_add:
      - AUDIT_WRITE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETGID
      - SETPCAP
      - SETUID
      - SYS_CHROOT
    networks:
      - proxy
      - nextcloud-backend
    environment:
      aliasgroup1: https://nextcloud.local.elmurphy.com:443
      aliasgroup2: http://nextcloud:80
      dictionaries: en_AU en_GB en_US
      username: ${COLLABORA_ADMIN_USERNAME}
      password: ${COLLABORA_ADMIN_PASSWORD}
      # num_prespawn_children=1: idle kit processes were pushing ~1.5 GiB into swap on the 8 GiB host.
      extra_params: --o:ssl.enable=false --o:ssl.termination=true --o:server_name=office.local.elmurphy.com --o:mount_jail_tree=false --o:net.frame_ancestors=https://nextcloud.local.elmurphy.com --o:num_prespawn_children=1
    labels:
      - traefik.enable=true
      - traefik.http.routers.nextcloud-office.rule=Host(`office.local.elmurphy.com`)
      - traefik.http.routers.nextcloud-office.tls=true
      - traefik.http.routers.nextcloud-office.middlewares=kds-media-only@file
      - traefik.http.services.nextcloud-office.loadbalancer.server.port=9980
    healthcheck:
      test: ["CMD", "/usr/bin/coolwsd", "--probe", "--use-env-vars"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 2m
    restart: unless-stopped

volumes:
  nextcloud-html:
    name: nextcloud-html
  nextcloud-db:
    name: nextcloud-db
  nextcloud-cache:
    name: nextcloud-cache

networks:
  proxy:
    external: true
  nextcloud-backend:
    name: nextcloud-backend
    internal: true
  nextcloud-egress:
    name: nextcloud-egress

configs:
  nextcloud-post-installation:
    content: |
      #!/bin/sh
      set -eu

      occ() {
        php /var/www/html/occ "$@"
      }

      if [ ! -d /var/www/html/data ]; then
        echo "The NFS data directory is missing at /var/www/html/data" >&2
        exit 1
      fi

      occ background:cron
      occ config:system:set maintenance_window_start --type=integer --value=1
      occ config:system:set default_phone_region --value=AU

      if ! occ app:install richdocuments; then
        occ app:enable richdocuments
      fi
      if ! occ app:install twofactor_totp; then
        occ app:enable twofactor_totp
      fi
      occ richdocuments:activate-config \
        --wopi-url=http://nextcloud-office:9980 \
        --callback-url=http://nextcloud
