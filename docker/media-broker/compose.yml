# Image-only stack; never add a build block (docs/hermes-media.md).
# The Renovate digest bump is the deploy trigger Portainer polls for.
services:
  media-broker:
    image: ghcr.io/mich-murphy/media-broker:main@sha256:b3de83c3b9794bd378906771ad9c582be3d7aad12e1af67dae00f4b0105c7ad6
    container_name: media-broker
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    networks:
      - proxy
    # MEDIA_BROKER_BIND is a Portainer stack variable holding this host's
    # verified Tailscale address. It has no fallback value.
    ports:
      - "${MEDIA_BROKER_BIND:?set MEDIA_BROKER_BIND in Portainer stack variables}:8765:8000"
    environment:
      SONARR_URL: "${SONARR_URL:?set Sonarr URL}"
      RADARR_URL: "${RADARR_URL:?set Radarr URL}"
      LIDARR_URL: "${LIDARR_URL:?set Lidarr URL}"
      TAUTULLI_URL: "${TAUTULLI_URL:?set Tautulli URL}"
      JELLYFIN_URL: "${JELLYFIN_URL:?set Jellyfin URL}"
      QBITTORRENT_URL: "${QBITTORRENT_URL:?set qBittorrent URL}"
      SONARR_API_KEY_FILE: /run/secrets/sonarr_api_key
      RADARR_API_KEY_FILE: /run/secrets/radarr_api_key
      LIDARR_API_KEY_FILE: /run/secrets/lidarr_api_key
      TAUTULLI_API_KEY_FILE: /run/secrets/tautulli_api_key
      JELLYFIN_API_KEY_FILE: /run/secrets/jellyfin_api_key
      # The WebUI username is a nonsecret identifier; the password stays a file.
      QBITTORRENT_USERNAME: "${QBITTORRENT_USERNAME:?set qBittorrent WebUI username}"
      QBITTORRENT_PASSWORD_FILE: /run/secrets/qbittorrent_password
      MEDIA_BROKER_TOKEN_FILE: /run/secrets/media_broker_token
      MEDIA_BROKER_BIND_HOST: "${MEDIA_BROKER_BIND_HOST:?set 0.0.0.0 only with explicit opt-in}"
      MEDIA_BROKER_ALLOW_PUBLIC_BIND: "${MEDIA_BROKER_ALLOW_PUBLIC_BIND:?set true only with exact allow-lists}"
      # Hermes uses this fixed authority over the Tailscale endpoint.
      MEDIA_BROKER_ALLOWED_HOSTS: docker-host:8765
      MEDIA_BROKER_ALLOWED_ORIGINS: http://docker-host:8765
      # Lidarr's observed inventory is about 2.27 MB; keep a 5 MB hard bound.
      MEDIA_BROKER_MAX_RESPONSE_BYTES: "5242880"
      # Gated write tools: brokered add/unmonitor, and the two-phase delete
      # that requires a fresh signed confirmation token per action. Setting
      # these in Compose keeps the switch out of Portainer stack variables.
      MEDIA_BROKER_ENABLE_REQUESTS: "true"
      MEDIA_BROKER_ENABLE_DELETES: "true"
    secrets:
      - source: media_broker_token
        target: media_broker_token
        uid: "65532"
        gid: "65532"
        mode: 0440
      - source: sonarr_api_key
        target: sonarr_api_key
        uid: "65532"
        gid: "65532"
        mode: 0440
      - source: radarr_api_key
        target: radarr_api_key
        uid: "65532"
        gid: "65532"
        mode: 0440
      - source: lidarr_api_key
        target: lidarr_api_key
        uid: "65532"
        gid: "65532"
        mode: 0440
      - source: tautulli_api_key
        target: tautulli_api_key
        uid: "65532"
        gid: "65532"
        mode: 0440
      - source: jellyfin_api_key
        target: jellyfin_api_key
        uid: "65532"
        gid: "65532"
        mode: 0440
      - source: qbittorrent_password
        target: qbittorrent_password
        uid: "65532"
        gid: "65532"
        mode: 0440
    # The image carries the healthcheck (unauthenticated GET /health);
    # a Compose override would shadow it, so there is deliberately none.
    restart: unless-stopped

secrets:
  media_broker_token:
    file: "${MEDIA_BROKER_SECRETS_DIR:-/etc/media-broker/secrets}/broker-token"
  sonarr_api_key:
    file: "${MEDIA_BROKER_SECRETS_DIR:-/etc/media-broker/secrets}/sonarr-api-key"
  radarr_api_key:
    file: "${MEDIA_BROKER_SECRETS_DIR:-/etc/media-broker/secrets}/radarr-api-key"
  lidarr_api_key:
    file: "${MEDIA_BROKER_SECRETS_DIR:-/etc/media-broker/secrets}/lidarr-api-key"
  tautulli_api_key:
    file: "${MEDIA_BROKER_SECRETS_DIR:-/etc/media-broker/secrets}/tautulli-api-key"
  jellyfin_api_key:
    file: "${MEDIA_BROKER_SECRETS_DIR:-/etc/media-broker/secrets}/jellyfin-api-key"
  qbittorrent_password:
    file: "${MEDIA_BROKER_SECRETS_DIR:-/etc/media-broker/secrets}/qbittorrent-password"

networks:
  # The existing application network provides reachability to the six
  # upstreams; no media or Docker socket mount is needed.
  proxy:
    external: true
    name: proxy
