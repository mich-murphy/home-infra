---
services:
  jellyfin:
    image: jellyfin/jellyfin:12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
    container_name: jellyfin
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: 1000:1000
    networks:
      - proxy
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - 992 # render group
    environment:
      - JELLYFIN_PublishedServerUrl=https://jellyfin.local.elmurphy.com
    volumes:
      - jellyfin-data:/config
      # Server encoding configuration uses /cache/transcodes: local disk, not RAM.
      - jellyfin-cache:/cache
      - type: bind
        source: /mnt/data/media
        target: /data/media
        read_only: true
        bind:
          propagation: rslave
      - type: bind
        source: /mnt/music
        target: /data/music
        read_only: true
        bind:
          propagation: rslave
    ports:
      # Direct fallback over Tailscale when Traefik is unavailable.
      # Docker-host filters ingress; the external Tailscale ACL controls clients.
      - 8096:8096
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyfin.rule=Host(`jellyfin.local.elmurphy.com`)
      - traefik.http.routers.jellyfin.tls=true
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8096/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  jellyfin-data:
    name: jellyfin-data
  jellyfin-cache:
    name: jellyfin-cache

networks:
  proxy:
    external: true
