---
services:
  portainer:
    image: portainer/portainer-ee:lts@sha256:0cd22f754ac52fcfceb362d5ce8f47ee23a5f6427484db17ebfaa4c8a00f7718
    container_name: portainer
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    volumes:
      - portainer-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      # escape hatch when traefik is down; allowlisted in docker_published_ports
      - 9443:9443
    labels:
      - traefik.enable=true
      - traefik.http.routers.portainer.rule=Host(`portainer.local.elmurphy.com`)
      - traefik.http.routers.portainer.tls=true
      - traefik.http.routers.portainer.middlewares=kds-media-only@file
      - traefik.http.services.portainer.loadbalancer.server.port=9000
    depends_on:
      - traefik
    restart: unless-stopped

  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: docker-socket-proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    # entrypoint renders haproxy.cfg into /tmp; haproxy writes its pidfile to /run
    tmpfs:
      - /tmp
      - /run
    networks:
      - docker-socket-proxy
    environment:
      - CONTAINERS=1
      - EVENTS=1
      - PING=1
      - POST=0
      - VERSION=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2375/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # The agent-facing name and tailnet port remain stable, but this service is
  # now a projection and never has access to the Docker socket.
  docker-socket-proxy-agent:
    image: python:3.14-slim@sha256:caaf356f40667c496d405780745b9ac25771c189a51dfcc42430d531ea09f8a2
    container_name: docker-socket-proxy-agent
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    networks:
      - docker-socket-proxy-agent
      - docker-socket-proxy-agent-backend
    ports:
      # Tailnet address only; also pinned to ai-dev in DOCKER-USER.
      - ${AGENT_PROXY_BIND}:2375:2375
    environment:
      # Changes the service config when the root-controlled source changes,
      # forcing Compose to replace the process rather than retain stale code.
      - OBSERVER_SOURCE_SHA256=${AGENT_OBSERVER_SOURCE_SHA256}
    volumes:
      - ./agent-observer/observer.py:/observer.py:ro
    command: ["python3", "/observer.py"]
    depends_on:
      - docker-socket-proxy-agent-backend
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1',2375),2); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Unexposed backend: the socket is available only to this pinned, reduced
  # proxy, and the observer above can reach only this fixed service name.
  docker-socket-proxy-agent-backend:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: docker-socket-proxy-agent-backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    # entrypoint renders haproxy.cfg into /tmp; haproxy writes its pidfile to /run
    tmpfs:
      - /tmp
      - /run
    networks:
      - docker-socket-proxy-agent-backend
    environment:
      - CONTAINERS=1
      - LOGS=1
      - PING=1
      - VERSION=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2375/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  traefik:
    image: traefik:v3.7.13@sha256:1c32e7c368204fd72812152ebdd2ac0425993df6fd982317deb02e48f2d5423c
    container_name: traefik
    security_opt:
      - no-new-privileges:true
    networks:
      proxy:
        aliases:
          # Portainer exchanges OAuth tokens server-side using the public
          # issuer URL. Resolve it to Traefik's TLS listener inside Docker.
          - pocket-id.local.elmurphy.com
          # Collabora fetches per-user settings from Nextcloud's public URL.
          # Keep that HTTPS request inside Docker instead of hairpinning out.
          - nextcloud.local.elmurphy.com
      docker-socket-proxy: {}
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
      - CF_API_EMAIL=${CF_API_EMAIL}
    volumes:
      - traefik-data:/letsencrypt
      - ./traefik.yml:/traefik.yml:ro
      - ./traefik-dynamic.yml:/traefik-dynamic.yml:ro
    ports:
      - 80:80
      - 443:443
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik-secure.entrypoints=websecure
      - traefik.http.routers.traefik-secure.rule=Host(`traefik.local.elmurphy.com`)
      - traefik.http.routers.traefik-secure.tls=true
      - traefik.http.routers.traefik-secure.middlewares=kds-media-only@file
      - traefik.http.routers.traefik-secure.tls.certresolver=cloudflare
      - traefik.http.routers.traefik-secure.tls.domains[0].main=local.elmurphy.com
      - traefik.http.routers.traefik-secure.tls.domains[0].sans=*.local.elmurphy.com
      - traefik.http.routers.traefik-secure.service=api@internal
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - docker-socket-proxy
    restart: unless-stopped

  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.14.0@sha256:01540977dcf4c7b41b1159f34d68e4632f2658d62790e460ca65a42722b13c4a
    container_name: pocket-id
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    environment:
      - APP_URL=https://pocket-id.local.elmurphy.com
      - TRUST_PROXY=true
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - MAXMIND_LICENSE_KEY=${MAXMIND_LICENSE_KEY}
      - PUID=1000
      - PGID=1000
      - ANALYTICS_DISABLED=true
    volumes:
      - pocketid-data:/app/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.pocket-id.rule=Host(`pocket-id.local.elmurphy.com`)
      - traefik.http.routers.pocket-id.tls=true
      - traefik.http.routers.pocket-id.middlewares=kds-media-only@file
      - traefik.http.services.pocket-id.loadbalancer.server.port=1411
    healthcheck:
      test: "wget --quiet --tries=1 --spider http://localhost:1411/healthz"
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s
    depends_on:
      - traefik
    restart: unless-stopped

volumes:
  portainer-data:
    name: portainer-data
  traefik-data:
    name: traefik-data
  pocketid-data:
    name: pocketid-data

networks:
  proxy:
    name: proxy
    ipam:
      config:
        - subnet: 172.20.1.0/24
  docker-socket-proxy:
    name: docker-socket-proxy
    internal: true
  # The observer needs a non-internal frontend for Docker's published port;
  # only the observer attaches to it. Its backend path remains private.
  docker-socket-proxy-agent:
    name: docker-socket-proxy-agent
  docker-socket-proxy-agent-backend:
    name: docker-socket-proxy-agent-backend
    internal: true
