---
tls:
  options:
    # opt-in via tls.options=modern@file
    modern:
      minVersion: VersionTLS13
      sniStrict: true
      curvePreferences:
        - X25519
        - CurveP256
        - CurveP384
    # applied automatically to every TLS router without explicit tls.options
    default:
      cipherSuites:
        - "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256"
        - "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256"
        - "TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384"
        - "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384"
        - "TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305"
        - "TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305"
      minVersion: "VersionTLS12"
      sniStrict: true
      curvePreferences:
        - X25519
        - CurveP256
        - CurveP384
http:
  serversTransports:
    # only for the truenas backend with a self-signed cert; never global
    insecure-internal:
      insecureSkipVerify: true
  routers:
    truenas:
      entryPoints:
        - "websecure"
      rule: "Host(`truenas.local.elmurphy.com`)"
      middlewares:
        - kds-media-only
        - default-headers
        - https-redirectscheme
      tls: {}
      service: truenas
  services:
    truenas:
      loadBalancer:
        servers:
          - url: "https://10.77.20.101"
        passHostHeader: true
        serversTransport: insecure-internal
  middlewares:
    https-redirectscheme:
      redirectScheme:
        scheme: https
        permanent: true
    # Applied to every non-media router. KDS can reach Docker HTTPS, but only
    # the explicitly media routers are available from that VLAN.
    kds-media-only:
      ipAllowList:
        sourceRange:
          - "10.77.1.0/24" # MGMT
          - "10.77.30.0/24" # DFLT
          - "100.64.0.0/10" # Tailscale
          - "172.20.1.0/24" # Docker proxy network (internal application calls)
    default-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 15552000
        customFrameOptionsValue: SAMEORIGIN
        customRequestHeaders:
          X-Forwarded-Proto: https
