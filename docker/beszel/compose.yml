---
services:
  beszel:
    image: henrygd/beszel:0.21.2@sha256:b0be90bd4aee2993fde763032a5098ce4386fba43cfe5031ec017b8d9e8c97a2
    container_name: beszel
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      proxy:
        # Fixed address: the host UFW rule admitting the hub to the local
        # beszel-agent (TCP 45876) is keyed on it (group_vars/docker.yaml).
        # Dynamic allocation starts at .2, so .250 stays clear of the pool.
        ipv4_address: 172.20.1.250
    environment:
      - DISABLE_PASSWORD_AUTH=true # use pocket-id
    volumes:
      - beszel-data:/beszel_data
    labels:
      - traefik.enable=true
      - traefik.http.routers.beszel.rule=Host(`beszel.local.elmurphy.com`)
      - traefik.http.routers.beszel.tls=true
      - traefik.http.routers.beszel.middlewares=kds-media-only@file
      - traefik.http.services.beszel.loadbalancer.server.port=8090
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://127.0.0.1:8090"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  beszel-data:
    name: beszel-data

networks:
  proxy:
    external: true
