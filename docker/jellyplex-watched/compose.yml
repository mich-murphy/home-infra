---
services:
  jellyplex-watched:
    image: luigi311/jellyplex-watched:8.5.3@sha256:e23a0d3dc686e4bbc9eeb655aeb96a2a1352bd2a26297ec77e06ef6f8eb2d5e1
    container_name: jellyplex-watched
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    networks:
      - proxy
    environment:
      PUID: "1000"
      PGID: "1000"
      DRYRUN: ${JELLYPLEX_DRYRUN:-True}
      DEBUG_LEVEL: ${JELLYPLEX_DEBUG_LEVEL:-INFO}
      RUN_ONLY_ONCE: ${JELLYPLEX_RUN_ONLY_ONCE:-False}
      SLEEP_DURATION: ${JELLYPLEX_SLEEP_DURATION:-900}
      LOG_FILE: /data/jellyplex-watched.log
      MARK_FILE: /data/marked.log
      REQUEST_TIMEOUT: "300"
      MAX_THREADS: "1"
      GENERATE_GUIDS: "True"
      GENERATE_LOCATIONS: "True"
      PLEX_BASEURL: http://plex:32400
      PLEX_TOKEN: ${JELLYPLEX_PLEX_TOKEN:?set JELLYPLEX_PLEX_TOKEN}
      JELLYFIN_BASEURL: http://jellyfin:8096
      JELLYFIN_TOKEN: ${JELLYPLEX_JELLYFIN_TOKEN:?set JELLYPLEX_JELLYFIN_TOKEN}
      USER_MAPPING: '{ "PayperBoi": "mm", "plex29542": "jabez" }'
      WHITELIST_LIBRARY: Movies, TV, YouTube
      WHITELIST_USERS: PayperBoi, mm, plex29542, jabez
      SYNC_FROM_PLEX_TO_JELLYFIN: "True"
      SYNC_FROM_JELLYFIN_TO_PLEX: "True"
      SYNC_FROM_PLEX_TO_PLEX: "False"
      SYNC_FROM_JELLYFIN_TO_JELLYFIN: "False"
    volumes:
      - jellyplex-watched-data:/data
    restart: unless-stopped

volumes:
  jellyplex-watched-data:
    name: jellyplex-watched-data

networks:
  proxy:
    external: true
