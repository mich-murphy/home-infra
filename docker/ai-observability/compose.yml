---
x-mlflow-image: &mlflow-image local/mlflow-auth:3.13.0
x-mlflow-secret: &mlflow-secret /etc/ai-observability/mlflow.env:/run/secrets/ai-observability.env:ro

services:
  mlflow:
    image: *mlflow-image
    build:
      context: .
      dockerfile: Dockerfile.mlflow-auth
    container_name: mlflow
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [ai-observability, proxy]
    environment:
      MLFLOW_ENABLE_OTEL_GENAI_SEMCONV: "true"
      MLFLOW_TRACE_ARCHIVAL_CONFIG: /opt/ai-observability/trace-archival.yaml
    command: [python, /opt/ai-observability/start-mlflow.py]
    volumes:
      - mlflow-data:/mlflow
      - *mlflow-secret
    labels:
      - traefik.enable=true
      - traefik.http.routers.mlflow.entrypoints=websecure
      - traefik.http.routers.mlflow.rule=Host(`mlflow.local.elmurphy.com`)
      - traefik.http.routers.mlflow.middlewares=secured@file
      - traefik.http.routers.mlflow.tls=true
      - traefik.http.services.mlflow.loadbalancer.server.port=5000
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    restart: unless-stopped

  mlflow-bootstrap:
    image: *mlflow-image
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [ai-observability]
    command: [python, /opt/ai-observability/bootstrap.py]
    volumes:
      - collector-config:/generated
      - *mlflow-secret
    depends_on:
      mlflow: {condition: service_healthy}
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    restart: "no"

  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.157.0@sha256:f2f01157055a9b2aab9df7118e1f1c9abf345e99b23bc7a2bc791db374a7d0f6
    container_name: otel-collector
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks:
      ai-observability: {}
      otlp-ingress: {gw_priority: 1}
    environment:
      OTELCOL_VERSION: "0.157.0"
      APP_AGENT_SCHEMA_VERSION: "1.2.0"
      APP_AGENT_OPERATIONAL_SAMPLING_PERCENTAGE: ${APP_AGENT_OPERATIONAL_SAMPLING_PERCENTAGE:-100}
    command: [--config=/etc/otelcol-contrib/config.yaml]
    volumes:
      - collector-config:/etc/otelcol-contrib:ro
    ports:
      - "4318:4318"
    expose: ["8888"]
    depends_on:
      mlflow-bootstrap: {condition: service_completed_successfully}
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    restart: unless-stopped

  mlflow-retention:
    image: *mlflow-image
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [ai-observability]
    environment:
      MLFLOW_RETENTION_INTERVAL_SECONDS: ${MLFLOW_RETENTION_INTERVAL_SECONDS:-86400}
    command: [python, /opt/ai-observability/retention.py]
    volumes:
      - collector-config:/generated:ro
      - *mlflow-secret
    depends_on:
      mlflow-bootstrap: {condition: service_completed_successfully}
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    restart: unless-stopped

  mlflow-backup:
    image: *mlflow-image
    user: "${PUID:-1001}:${PGID:-1002}"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      MLFLOW_BACKUP_INTERVAL_SECONDS: ${MLFLOW_BACKUP_INTERVAL_SECONDS:-86400}
      MLFLOW_BACKUP_RETENTION_DAYS: ${MLFLOW_BACKUP_RETENTION_DAYS:-14}
    command: [python, /opt/ai-observability/backup.py]
    volumes:
      - mlflow-data:/mlflow:ro
      - /mnt/data/backups/mlflow:/backups
    depends_on:
      mlflow: {condition: service_healthy}
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    restart: unless-stopped

  conformance:
    profiles: [conformance]
    image: *mlflow-image
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [ai-observability]
    command: [python, /opt/ai-observability/conformance.py]
    volumes:
      - *mlflow-secret
    depends_on:
      mlflow-bootstrap: {condition: service_completed_successfully}
      otel-collector: {condition: service_started}
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    restart: "no"

volumes:
  mlflow-data: {name: mlflow-data}
  collector-config: {name: ai-observability-collector-config}

networks:
  ai-observability: {name: ai-observability, internal: true}
  proxy: {name: proxy, external: true}
  otlp-ingress: {name: ai-observability-ingress}
