---
x-mlflow-image: &mlflow-image ghcr.io/mlflow/mlflow:v3.13.0@sha256:b2136d49f882fdc9c48bdb95514a8a23804e8756524135c3f09f7a553a3ac58b

services:
  mlflow:
    image: *mlflow-image
    container_name: mlflow
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - ai-observability
      - proxy
    environment:
      MLFLOW_ENABLE_OTEL_GENAI_SEMCONV: "true"
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - file:///mlflow/artifacts
      - --allowed-hosts
      - mlflow.local.elmurphy.com,mlflow:5000,localhost:*,127.0.0.1:*
      - --cors-allowed-origins
      - https://mlflow.local.elmurphy.com
    volumes:
      - mlflow-data:/mlflow
    labels:
      - traefik.enable=true
      - traefik.http.routers.mlflow.entrypoints=websecure
      - traefik.http.routers.mlflow.rule=Host(`mlflow.local.elmurphy.com`)
      - traefik.http.routers.mlflow.middlewares=secured@file
      - traefik.http.routers.mlflow.tls=true
      - traefik.http.services.mlflow.loadbalancer.server.port=5000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    restart: unless-stopped

  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.157.0@sha256:f2f01157055a9b2aab9df7118e1f1c9abf345e99b23bc7a2bc791db374a7d0f6
    container_name: otel-collector
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    networks:
      - ai-observability
    environment:
      OTELCOL_VERSION: "0.157.0"
      APP_AGENT_SCHEMA_VERSION: "1.0.0"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./collector.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      # DOCKER-USER blocks the external interface; tailscale0 remains reachable.
      - "4318:4318"
    expose:
      - "8888"
    depends_on:
      mlflow:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    restart: unless-stopped

volumes:
  mlflow-data:
    name: mlflow-data

networks:
  ai-observability:
    name: ai-observability
    internal: true
  proxy:
    name: proxy
    external: true
