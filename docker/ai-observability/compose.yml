---
x-mlflow-image: &mlflow-image ghcr.io/mlflow/mlflow:v3.13.0@sha256:b2136d49f882fdc9c48bdb95514a8a23804e8756524135c3f09f7a553a3ac58b

services:
  mlflow:
    image: *mlflow-image
    container_name: mlflow
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - ai-observability
      - proxy
    environment:
      MLFLOW_ENABLE_OTEL_GENAI_SEMCONV: "true"
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - file:///mlflow/artifacts
      - --allowed-hosts
      - mlflow.local.elmurphy.com,mlflow:5000,localhost:*,127.0.0.1:*
      - --cors-allowed-origins
      - https://mlflow.local.elmurphy.com
    volumes:
      - mlflow-data:/mlflow
    labels:
      - traefik.enable=true
      - traefik.http.routers.mlflow.entrypoints=websecure
      - traefik.http.routers.mlflow.rule=Host(`mlflow.local.elmurphy.com`)
      - traefik.http.routers.mlflow.middlewares=secured@file
      - traefik.http.routers.mlflow.tls=true
      - traefik.http.services.mlflow.loadbalancer.server.port=5000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    restart: unless-stopped

  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.157.0@sha256:f2f01157055a9b2aab9df7118e1f1c9abf345e99b23bc7a2bc791db374a7d0f6
    container_name: otel-collector
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      ai-observability: {}
      otlp-ingress:
        gw_priority: 1
    environment:
      OTELCOL_VERSION: "0.157.0"
      APP_AGENT_SCHEMA_VERSION: "1.0.0"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    configs:
      - source: otel-collector-config
        target: /etc/otelcol-contrib/config.yaml
    ports:
      # DOCKER-USER blocks the external interface; tailscale0 remains reachable.
      - "4318:4318"
    expose:
      - "8888"
    depends_on:
      mlflow:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    restart: unless-stopped

volumes:
  mlflow-data:
    name: mlflow-data

networks:
  ai-observability:
    name: ai-observability
    internal: true
  proxy:
    name: proxy
    external: true
  otlp-ingress:
    name: ai-observability-ingress

configs:
  otel-collector-config:
    content: |-
      ---
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318

      processors:
        memory_limiter:
          check_interval: 1s
          limit_mib: 384
          spike_limit_mib: 96

        resource/version:
          attributes:
            - key: app.agent.schema.version
              value: $${env:APP_AGENT_SCHEMA_VERSION}
              action: upsert
            - key: app.agent.collector.version
              value: $${env:OTELCOL_VERSION}
              action: upsert
            - key: deployment.environment.name
              value: local
              action: upsert

        transform/resource-privacy:
          error_mode: ignore
          trace_statements:
            - context: resource
              statements:
                - keep_keys(resource.attributes, ["service.name", "service.version", "deployment.environment.name", "app.agent.schema.version", "app.agent.collector.version", "app.agent.harness.name", "app.agent.harness.version", "app.agent.repository.hash", "app.agent.repository.base_revision", "app.agent.skill.catalogue_hash"])

        attributes/normalize-agent-details:
          actions:
            - key: skill.name
              from_attribute: skill_name
              action: upsert
            - key: tool.type
              from_attribute: tool_name
              action: upsert

        redaction/metadata-only:
          allow_all_keys: false
          allowed_keys:
            - service.name
            - service.version
            - deployment.environment.name
            - app.agent.schema.version
            - app.agent.collector.version
            - app.agent.record.type
            - app.agent.task.id
            - app.agent.task.class
            - app.agent.risk.class
            - app.agent.session.id
            - app.agent.parent.task_id
            - app.agent.harness.name
            - app.agent.harness.version
            - app.agent.model.lane
            - app.agent.model.effort
            - app.agent.model.requested
            - app.agent.model.returned
            - app.agent.repository.hash
            - app.agent.repository.base_revision
            - app.agent.skill.catalogue_hash
            - app.agent.skill.name
            - app.agent.skill.package_hash
            - app.agent.skill.selection
            - app.agent.skill.activation
            - app.agent.skill.trigger
            - app.agent.skill.resource.class
            - app.agent.tool.type
            - app.agent.tool.status
            - app.agent.permission.decision
            - app.agent.permission.policy
            - app.agent.validation.type
            - app.agent.validation.status
            - app.agent.validation.passed
            - app.agent.validation.failed
            - app.agent.validation.skipped
            - app.agent.retry.count
            - app.agent.outcome.status
            - app.agent.outcome.reference
            - app.agent.final.status
            - app.agent.tokens.input
            - app.agent.tokens.output
            - app.agent.tokens.cached
            - app.agent.tokens.reasoning
            - app.agent.duration_ms
            - app.agent.time_to_first_output_ms
            - app.agent.permission_wait_ms
            - app.agent.human_rework_minutes
            - gen_ai.operation.name
            - gen_ai.provider.name
            - gen_ai.request.model
            - gen_ai.response.model
            - gen_ai.response.finish_reasons
            - gen_ai.usage.input_tokens
            - gen_ai.usage.output_tokens
            - error.type
            - retry.count
            - session.id
            - skill.name
            - tool.type
            - tool.status
            - validation.status
            - outcome.status
          blocked_key_patterns:
            - "(?i).*(prompt|message|content|body|source|diff|command|path|argument|payload|authorization|cookie|secret|password|api[_-]?key).*"
          blocked_values:
            - "(?i)(bearer|basic)[[:space:]]+[a-z0-9._~+/=-]{8,}"
            - "(?i)(sk|key|token|secret|password)[_-]?[a-z0-9]{8,}"
            - "-----BEGIN[[:space:]][A-Z ]+PRIVATE KEY-----"
            - "(/Users/|/home/|[A-Za-z]:\\\\Users\\\\)"
          redact_all_types: true
          summary: info

        batch:
          send_batch_size: 256
          send_batch_max_size: 512
          timeout: 2s

      exporters:
        otlp_http/mlflow:
          endpoint: http://mlflow:5000
          compression: gzip
          headers:
            x-mlflow-experiment-id: "0"
          timeout: 10s
          retry_on_failure:
            enabled: true
            initial_interval: 1s
            max_interval: 30s
            max_elapsed_time: 0s
          sending_queue:
            enabled: true
            num_consumers: 2
            queue_size: 2048

      service:
        pipelines:
          traces:
            receivers: [otlp]
            processors:
              - memory_limiter
              - resource/version
              - transform/resource-privacy
              - attributes/normalize-agent-details
              - redaction/metadata-only
              - batch
            exporters: [otlp_http/mlflow]
        telemetry:
          logs:
            level: info
            encoding: json
          metrics:
            level: detailed
            readers:
              - pull:
                  exporter:
                    prometheus:
                      host: 0.0.0.0
                      port: 8888
                      without_type_suffix: true
                      without_units: true
