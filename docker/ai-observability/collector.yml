---
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96

  resource/version:
    attributes:
      - key: app.agent.schema.version
        value: ${env:APP_AGENT_SCHEMA_VERSION}
        action: upsert
      - key: app.agent.collector.version
        value: ${env:OTELCOL_VERSION}
        action: upsert
      - key: deployment.environment.name
        value: local
        action: upsert

  transform/resource-privacy:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - keep_keys(resource.attributes, ["service.name", "service.version", "deployment.environment.name", "app.agent.schema.version", "app.agent.collector.version", "app.agent.harness.name", "app.agent.harness.version", "app.agent.repository.hash", "app.agent.repository.base_revision", "app.agent.skill.catalogue_hash"])

  redaction/metadata-only:
    allow_all_keys: false
    allowed_keys:
      - service.name
      - service.version
      - deployment.environment.name
      - app.agent.schema.version
      - app.agent.collector.version
      - app.agent.record.type
      - app.agent.task.id
      - app.agent.task.class
      - app.agent.risk.class
      - app.agent.session.id
      - app.agent.parent.task_id
      - app.agent.harness.name
      - app.agent.harness.version
      - app.agent.model.lane
      - app.agent.model.effort
      - app.agent.model.requested
      - app.agent.model.returned
      - app.agent.repository.hash
      - app.agent.repository.base_revision
      - app.agent.skill.catalogue_hash
      - app.agent.skill.name
      - app.agent.skill.package_hash
      - app.agent.skill.selection
      - app.agent.skill.activation
      - app.agent.skill.trigger
      - app.agent.skill.resource.class
      - app.agent.tool.type
      - app.agent.tool.status
      - app.agent.permission.decision
      - app.agent.permission.policy
      - app.agent.validation.type
      - app.agent.validation.status
      - app.agent.validation.passed
      - app.agent.validation.failed
      - app.agent.validation.skipped
      - app.agent.retry.count
      - app.agent.outcome.status
      - app.agent.outcome.reference
      - app.agent.final.status
      - app.agent.tokens.input
      - app.agent.tokens.output
      - app.agent.tokens.cached
      - app.agent.tokens.reasoning
      - app.agent.duration_ms
      - app.agent.time_to_first_output_ms
      - app.agent.permission_wait_ms
      - app.agent.human_rework_minutes
      - gen_ai.operation.name
      - gen_ai.provider.name
      - gen_ai.request.model
      - gen_ai.response.model
      - gen_ai.response.finish_reasons
      - gen_ai.usage.input_tokens
      - gen_ai.usage.output_tokens
      - error.type
      - retry.count
      - session.id
      - skill.name
      - tool.type
      - tool.status
      - validation.status
      - outcome.status
    blocked_key_patterns:
      - "(?i).*(prompt|message|content|body|source|diff|command|path|argument|payload|authorization|cookie|secret|password|api[_-]?key).*"
    blocked_values:
      - "(?i)(bearer|basic)[[:space:]]+[a-z0-9._~+/=-]{8,}"
      - "(?i)(sk|key|token|secret|password)[_-]?[a-z0-9]{8,}"
      - "-----BEGIN[[:space:]][A-Z ]+PRIVATE KEY-----"
      - "(/Users/|/home/|[A-Za-z]:\\\\Users\\\\)"
    redact_all_types: true
    summary: info

  batch:
    send_batch_size: 256
    send_batch_max_size: 512
    timeout: 2s

exporters:
  otlphttp/mlflow:
    endpoint: http://mlflow:5000
    compression: gzip
    headers:
      x-mlflow-experiment-id: "0"
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 2048

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors:
        - memory_limiter
        - resource/version
        - transform/resource-privacy
        - redaction/metadata-only
        - batch
      exporters: [otlphttp/mlflow]
  telemetry:
    logs:
      level: info
      encoding: json
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_type_suffix: true
                without_units: true
