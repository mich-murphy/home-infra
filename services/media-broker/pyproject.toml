[project]
name = "media-broker"
version = "0.1.0"
description = "Read-only MCP broker for local media services"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx==0.28.1",
    "mcp==1.26.0",
]

[project.scripts]
media-broker = "media_broker.server:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "ruff==0.13.2",
]

[build-system]
requires = ["uv_build==0.12.5"]
build-backend = "uv_build"
